# 立创·天空星 STM32F407 核心板
# 规则：查得到公开资料的写 verified: true 并在 sources 里给出处；查不到的写 TODO 或 verified: false。
# 板载资源（LED/HSE）来自立创官方文档；电机/编码器/串口等是"建议接线"，必须按你的实际接线确认。
schema_version: 1
name: stm32f407-skystar
vendor: 立创开发板 (LCKFB)
description: 立创·天空星核心板，STM32F407 版本（青春版 VET6 / 高配版 VGT6，PCB 相同）
port: stm32f4-hal

mcu:
  family: stm32f4
  part: TODO            # 青春版为 STM32F407VET6（512KB Flash），高配版为 STM32F407VGT6（1MB Flash），请看芯片丝印
  core: cortex-m4f
  fpu: true
  flash_kb: 512         # 取两版中较小值，保证链接脚本对两版都安全
  ram_kb: 192           # 官方参数写 SRAM 192K（含 64K CCM）；链接脚本只用 128K 主 SRAM

clock:
  hse_hz: 8000000       # 官方文档：高速晶振 8MHz
  sysclk_hz: 168000000

toolchain:
  compiler: arm-none-eabi-gcc
  flasher: openocd
  openocd_interface: TODO   # 你用的下载器：interface/stlink.cfg 或 interface/cmsis-dap.cfg
  openocd_target: target/stm32f4x.cfg

sources:
  - what: 板卡版本、芯片、晶振 8MHz、调试口引出 SWD+SWO+串口1
    url: https://wiki.lckfb.com/zh-hans/fdb/skystar.html
  - what: 用户 LED 接 PB2（BOOT1），高电平点亮；用户按键外置下拉、按下为高电平
    url: https://wiki.lckfb.com/zh-hans/tkx/hardware/schematic.html
  - what: LED 高电平点亮（MicroPython 教程中的资源汇总表）
    url: https://wiki.lckfb.com/zh-hans/fdb/micropython/gpio-basic/led-control.html

todo:
  - 芯片具体型号（VET6 还是 VGT6）
  - 用户按键所接引脚（文档文字未写明引脚号，需看原理图图片或丝印）
  - 调试口"串口1"实际是哪两个引脚（推测为 USART1 默认的 PA9/PA10，未在文字资料中核实）
  - 电机驱动、编码器、电池分压的实际接线（下面是建议接线）
  - 下载器类型（ST-Link / DAP-Link）
  - 建议接线是否与板载 TF 卡（SDIO）和 SPI FLASH 的引脚冲突（未查到 SPI FLASH 的引脚）

resources:
  gpio:
    - name: LED
      pin: PB2
      dir: out
      active_low: false
      init: false
      verified: true
      note: 板载绿色 LED，高电平点亮；PB2 兼作 BOOT1，板上已下拉
    - name: KEY
      pin: TODO
      dir: in
      pull: none
      active_low: false
      note: 板载用户按键，外置下拉，按下为高电平（引脚待确认）
    - name: MOTOR_A_IN1
      pin: PB12
      dir: out
      init: false
      verified: false
      note: 建议接线：TB6612 AIN1
    - name: MOTOR_A_IN2
      pin: PB13
      dir: out
      init: false
      verified: false
      note: 建议接线：TB6612 AIN2

  pwm:
    - name: MOTOR_A
      timer: TIM1
      channel: 1
      pin: PA8
      freq_hz: 20000
      verified: false
      note: 建议接线：TB6612 PWMA；20kHz 在人耳可闻范围之外

  encoder:
    - name: MOTOR_A
      timer: TIM4
      pin_a: PD12
      pin_b: PD13
      invert: false
      filter: 6
      verified: false
      note: 建议接线：电机霍尔编码器 A/B 相；方向反了改 invert，不要改代码

  uart:
    - name: LINK
      instance: USART1
      tx: PA9
      rx: PA10
      baud: 460800
      rx_buf: 512
      tx_buf: 256
      dma: true
      verified: false
      note: 与工作台通信；USB-TTL 需支持 460800

  timer:
    - name: CTRL
      instance: TIM6
      irq_priority: 1
      note: 控制环节拍，优先级高于串口 DMA

  adc:
    - name: VBAT
      instance: ADC1
      channel: 10
      pin: PC0
      vref_mv: 3300
      scale_num: 1
      scale_den: 1
      verified: false
      note: 电池电压监测；请按你的分压电阻填写 scale（例如 10k/1k 分压填 11/1）
