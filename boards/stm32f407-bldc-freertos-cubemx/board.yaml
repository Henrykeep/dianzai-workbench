# 由 tools/ioc_import.py 从 CubeMX .ioc 生成；引脚/实例请改 .ioc 后重新导入，这里只手改 name/verified/note/invert/scale 等说明字段
schema_version: 1
name: stm32f407-bldc-freertos-cubemx
vendor: 学长的 F407VET6 小车板（Bldc.ioc，板卡型号未知）
description: 学长真实工程 Bldc.ioc 的拷贝（FreeRTOS + HAL 时基 TIM1），按 docs/05 约定补了 User Label；用来验证移植层的
  FreeRTOS/TIM 时基模式。cubemx/Core 下工程为【合成样例】（仿 CubeMX 生成结构手写），未上板测试
sources:
- what: 引脚分配、定时器/串口/FreeRTOS 配置来自用户上传的 Bldc.ioc（tools/testdata/real/bldc_f407vet6.ioc）
  url: tools/testdata/real/README.md
todo:
- 相对原工程的改动（需确认）：只补了约定标签（AIN1=PB13→MOTOR_A_IN1、AIN2=PB12、BIN1=PB14、BIN2=PB15、PWMA=PA1、PWMB=PA0、
  左轮编码器=TIM3、右轮=TIM4、UART4=BEAM（QD4310 摆杆）、USART2=VISION（MaixCAM2），据 review.md），删掉了 functionlistsort 里残留的 MX_TIM6_Init
- TIM2 PWM 已从原工程 500Hz 改为 20kHz（Prescaler=0, Period=4200-1）
- UART4 921600 无 RX DMA：移植层逐字节中断接收（约 9.2 万次中断/秒），建议加 UART4_RX Circular DMA
- I2C1（PB8/PB9）已配置但 PAL 暂无 I2C 类型，未纳入 resources
toolchain:
  compiler: arm-none-eabi-gcc
  flasher: openocd
  openocd_interface: TODO
  openocd_target: target/stm32f4x.cfg
port: stm32-cubemx
config_source:
  tool: cubemx
  file: cubemx/bldc_rtos.ioc
  hal_timebase: TIM1
  rtos: freertos
mcu:
  part: STM32F407VET6
  family: stm32f4
  core: cortex-m4f
  flash_kb: 512
  nvm_kb: 32   # 掉电保存区（参数 + 黑匣子，pal_nvm_*）：扇区 1..2（0x08004000，2×16 KB）；0 或不写 = 不用
clock:
  hse_hz: 8000000
  sysclk_hz: 168000000
resources:
  gpio:
  - name: MOTOR_A_IN2
    pin: PB12
    dir: out
  - name: MOTOR_A_IN1
    pin: PB13
    dir: out
  - name: MOTOR_B_IN1
    pin: PB14
    dir: out
  - name: MOTOR_B_IN2
    pin: PB15
    dir: out
  - name: KEY1
    pin: PD12
    dir: in
    pull: up
  - name: KEY2
    pin: PD13
    dir: in
    pull: up
  - name: KEY3
    pin: PD14
    dir: in
    pull: up
  - name: KEY4
    pin: PD15
    dir: in
    pull: up
  - name: SENSOR1
    pin: PE8
    dir: in
  - name: SENSOR2
    pin: PE9
    dir: in
  - name: SENSOR3
    pin: PE10
    dir: in
  - name: SENSOR4
    pin: PE11
    dir: in
  - name: SENSOR5
    pin: PE12
    dir: in
  - name: SENSOR6
    pin: PE13
    dir: in
  - name: SENSOR7
    pin: PE14
    dir: in
  - name: SENSOR8
    pin: PE15
    dir: in
  pwm:
  - name: MOTOR_B
    timer: TIM2
    channel: 1
    pin: PA0
    freq_hz: 20000
  - name: MOTOR_A
    timer: TIM2
    channel: 2
    pin: PA1
    freq_hz: 20000
  encoder:
  - name: MOTOR_A
    timer: TIM3
    pin_a: PA6
    pin_b: PA7
  - name: MOTOR_B
    timer: TIM4
    pin_a: PB6
    pin_b: PB7
  uart:
  - name: BEAM
    instance: UART4
    tx: PC10
    rx: PC11
    baud: 921600
    dma: false
  - name: VISION
    instance: USART2
    tx: PA2
    rx: PA3
    baud: 115200
    dma: false
  timer:
  - name: CTRL
    instance: TIM5
    irq_priority: 5
    note: 按 .ioc 计算更新频率 500 Hz
