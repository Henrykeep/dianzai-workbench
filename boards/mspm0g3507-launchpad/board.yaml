# TI LP-MSPM0G3507 LaunchPad —— 参考板（car_2wd 同一套电机/编码器引脚，换板只换引脚）
# 【已核对】LED1=PA0、RGB=PB22/PB26/PB27、S2=PB21、背板 UART0=PA10/PA11 取自 MSPM0 SDK 2.11 的 LP_MSPM0G3507 官方例程 .syscfg
#   （gpio_toggle_output / uart_echo_interrupts_standby / gpio_input_capture）。RGB 颜色对应关系【推断】，按 LP 用户指南确认。
# 【已实测】syscfg/ 由 SysConfig CLI 1.28.0 生成（tools/syscfg_gen.sh mspm0g3507-launchpad）。【未验证】未上板；电机引脚接到 LP 排针，要对照 LP 丝印确认。
# 注意：PA0 是开漏引脚（LED1 有板载上拉），不要拿它做推挽输出用途；UART0 经 XDS110 转成虚拟串口，直接用 USB 连接上位机。
schema_version: 1
name: mspm0g3507-launchpad
vendor: Texas Instruments
description: LP-MSPM0G3507 LaunchPad 参考板；XDS110 板载；car_2wd 可交叉编译，未上板测试
port: mspm0-driverlib
config_source:
  tool: sysconfig
  file: ccs/launchpad.syscfg
mcu:
  family: mspm0
  part: MSPM0G3507
  core: cortex-m0plus
  fpu: false
  flash_kb: 128         # 与 SDK linker_files/gcc/mspm0g3507.lds 一致（0x20000）
  ram_kb: 32            # 同上（SRAM 0x8000）
clock:
  sysclk_hz: 32000000   # 合成配置用 SYSOSC 32 MHz、不开 PLL（最高 80 MHz，换成真实 .syscfg 后以其为准）
toolchain:
  compiler: arm-none-eabi-gcc
  flasher: xds110
todo:
  - 上板验证 car_2wd（电机驱动接 LP 排针）
resources:
  gpio:
  - name: LED             # LED1（红），PA0 开漏
    pin: PA0
    dir: out
  - name: KEY             # S2，按下为低
    pin: PB21
    dir: in
    pull: up
    active_low: true
  - name: MOTOR_A_IN1
    pin: PB13
    dir: out
  - name: MOTOR_A_IN2
    pin: PB14
    dir: out
  - name: MOTOR_B_IN1
    pin: PB15
    dir: out
  - name: MOTOR_B_IN2
    pin: PB16
    dir: out
  pwm:                    # SysConfig 实例名 PWM_TIMG0（两路共用 TIMG0）
  - name: MOTOR_A
    timer: TIMG0
    channel: 0
    pin: PA12
    freq_hz: 20000
  - name: MOTOR_B
    timer: TIMG0
    channel: 1
    pin: PA13
    freq_hz: 20000
  encoder:
  - name: MOTOR_A         # SysConfig QEI 实例 ENC_MOTOR_A（G3507 只有 TIMG8 带 QEI）
    timer: TIMG8
    pin_a: PA29
    pin_b: PA30
  - name: MOTOR_B         # SysConfig GPIO 组 ENC_MOTOR_B（引脚 A/B，双边沿中断）
    mode: gpio_isr
    pin_a: PB6
    pin_b: PB7
  uart:
  - name: LINK
    instance: UART0
    tx: PA10
    rx: PA11
    baud: 115200
    dma: false            # 本移植层用 RX/TX 中断 + 软件环形缓冲（未用 DMA）
  timer:
  - name: CTRL
    instance: TIMG7
    clk_hz: 1000000       # 计数时钟 = 32 MHz / timerClkPrescale 32（与 .syscfg 一致）
