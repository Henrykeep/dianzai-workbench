# 立创·天猛星 MSPM0G3507 开发板 —— 2 电机小车（car_2wd）
# 配置来源为 SysConfig（ccs/tianmengxing.syscfg -> syscfg/ti_msp_dl_config.{c,h}）。
# 【已实测】syscfg/ 下文件由 SysConfig CLI 1.28.0 + MSPM0 SDK 2.11 生成（tools/syscfg_gen.sh，CI firmware 工作流比对）；【未验证】未上板。
# 引脚为我按 mspm0g350x.h 的 IOMUX 表挑的可用组合（复用功能已对照该头文件），**不是天猛星原理图核实的接线**。
schema_version: 1
name: mspm0g3507-tianmengxing
vendor: 嘉立创 (LCKFB)
description: 天猛星 MSPM0G3507；SysConfig + DriverLib；car_2wd 可交叉编译，未上板测试
port: mspm0-driverlib
# 保留引脚：功能名对照 TI SLAU873（LP-MSPM0G3507 用户指南）与 mspm0g350x.h IOMUX（PINCM41/42 = SWDIO/SWCLK）。
# PA10/PA11 接板载 CH340 是天猛星资料的说法【未对照原理图】；晶振脚是否焊了晶体【未核实】，所以只告警。
reserved_pins:
  PA19: {reason: "SWDIO（调试口，复用后无法下载/调试）", level: err}
  PA20: {reason: "SWCLK（调试口，复用后无法下载/调试）", level: err}
  PA10: {reason: "UART0_TX → 板载 CH340（USB 串口）", level: err, allow: [uart.LINK.]}
  PA11: {reason: "UART0_RX ← 板载 CH340（USB 串口）", level: err, allow: [uart.LINK.]}
  PA2:  {reason: "ROSC（SYSOSC 外部校准电阻脚）", level: warn}
  PA3:  {reason: "LFXIN（32 kHz 晶振）", level: warn}
  PA4:  {reason: "LFXOUT（32 kHz 晶振）", level: warn}
  PA5:  {reason: "HFXIN（高速晶振）", level: warn}
  PA6:  {reason: "HFXOUT（高速晶振）", level: warn}
config_source:
  tool: sysconfig
  file: ccs/tianmengxing.syscfg
mcu:
  family: mspm0
  part: MSPM0G3507
  core: cortex-m0plus
  fpu: false
  flash_kb: 128         # 与 SDK linker_files/gcc/mspm0g3507.lds 一致（0x20000）
  nvm_kb: 4   # 掉电保存区（参数 + 黑匣子，pal_nvm_*）：Flash 末尾 4 扇区（4 KB）；0 或不写 = 不用
  ram_kb: 32            # 同上（SRAM 0x8000）
clock:
  sysclk_hz: 32000000   # 合成配置用 SYSOSC 32 MHz、不开 PLL（最高 80 MHz，换成真实 .syscfg 后以其为准）
toolchain:
  compiler: arm-none-eabi-gcc
  flasher: TODO
todo:
  - 按天猛星原理图核对全部引脚（改 .syscfg 后跑 tools/syscfg_gen.sh --write）
  - 板载 LED / 按键 / 调试串口引脚（查原理图后填写）
resources:
  gpio:
  - name: MOTOR_A_IN1
    pin: PB13
    dir: out
  - name: MOTOR_A_IN2
    pin: PB14
    dir: out
  - name: MOTOR_B_IN1
    pin: PB15
    dir: out
  - name: MOTOR_B_IN2
    pin: PB16
    dir: out
  - name: US_TRIG         # HC-SR04 触发（v0.6.0）；【未验证】引脚未对照原理图
    pin: PB8
    dir: out
  - name: US_ECHO         # HC-SR04 回波：输入，边沿中断由 pal_gpio_irq_attach 运行时打开；5 V 模块需分压
    pin: PB9
    dir: in
  pwm:                    # SysConfig 实例名 PWM_TIMG0（两路共用 TIMG0）
  - name: MOTOR_A
    timer: TIMG0
    channel: 0
    pin: PA12
    freq_hz: 20000
  - name: MOTOR_B
    timer: TIMG0
    channel: 1
    pin: PA13
    freq_hz: 20000
  encoder:
  - name: MOTOR_A         # SysConfig QEI 实例 ENC_MOTOR_A（G3507 只有 TIMG8 带 QEI）
    timer: TIMG8
    pin_a: PA29
    pin_b: PA30
  - name: MOTOR_B         # SysConfig GPIO 组 ENC_MOTOR_B（引脚 A/B，双边沿中断）
    mode: gpio_isr
    pin_a: PB6
    pin_b: PB7
  uart:
  - name: LINK
    instance: UART0
    tx: PA10
    rx: PA11
    baud: 115200
    dma: false            # 本移植层用 RX/TX 中断 + 软件环形缓冲（未用 DMA）
  - name: IMU             # SysConfig 实例 UART_IMU：姿态模块口（dzimu），波特率与 apps/imu_module 一致
    instance: UART1
    tx: PA8
    rx: PA9
    baud: 460800
    dma: false
  i2c:                    # SysConfig 实例 I2C_IMU（I2C0 主机 400 kHz）；PA0/PA1 为开漏脚，需外部上拉（MPU6050 模块一般自带）
  - name: IMU
    instance: I2C0
    scl: PA1
    sda: PA0
    speed_hz: 400000
    note: 板外 MPU6050 等；【编译】未上板
  spi:                    # SysConfig 实例 SPI_BUS1（mode 3、1 MHz）+ 软件片选 GPIO_CS_SPI1_<名>
  - name: DEV
    instance: SPI1
    sck: PB23
    mosi: PB22
    miso: PB21
    cs: PB20
    mode: 3
    hz: 1000000
    note: 板外 SPI 器件（BMI088 / TFT 等，一个设备一根片选）；【编译】未上板
  adc:                    # SysConfig 实例 ADC12_0（ADC0 单次软件触发）；pal_adc_read 运行时切 MEM0 通道
  - name: VBAT
    instance: ADC0
    channel: 2
    pin: PA25
    bits: 12
    vref_mv: 3300
    scale_num: 11         # 假定 10k:1k 分压（2S 锂电 8.4 V → 0.76 V）；【未验证】天猛星板上没有这个分压，要自己焊
    scale_den: 1
  timer:
  - name: CTRL
    instance: TIMG7
    clk_hz: 1000000       # 计数时钟 = 32 MHz / timerClkPrescale 32（与 .syscfg 一致）
