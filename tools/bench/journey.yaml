# make bench 的全流程阶段表：真实队伍从拿题到比赛结束（统筹者《开发全流程旅程图》，改阶段只改这里）。
# supported：工作台有没有这项能力；where：在哪；human：基准没自动完成时要人做什么；
# auto_if：基准里哪一步真跑通了就算 AI 自动完成（build_link | relay | default_step），没有 = 基准不自动做。
- {stage: 拆指标, supported: true, where: "tools/req.py（requirements.yaml）", human: "人写 requirements.yaml"}
- {stage: 定方案选板器件, supported: true, where: "tools/scheme.py", human: "人写/确认 scheme.yaml"}
- {stage: 分工, supported: false, human: "队内人工分工"}
- {stage: 工程与引脚, supported: true, where: "tools/alloc.py、新建工程向导", human: "基准沿用已有工程，未走向导"}
- {stage: 驱动点亮, supported: true, where: "make test（tests/host 驱动单测）", human: "基准不跑，靠 make test；实物需人上板"}
- {stage: 子系统联调, supported: true, where: "仿真板自动构建 + 链路 schema 识别", auto_if: build_link, human: "没连上"}
- {stage: 标定调参, supported: true, where: "无初值一键起步（继电 → TL 规则）", auto_if: relay, human: "沿用人写的默认参数；标定靠人"}
- {stage: 对照评分自测, supported: true, where: "阶跃实验 + accept.py", auto_if: default_step, human: "没跑到评分"}
- {stage: 设计报告封箱, supported: true, where: "tools/report.py（未接入基准）", human: "人出报告并封箱"}
- {stage: 现场应急修改, supported: false, human: "现场人工改"}
