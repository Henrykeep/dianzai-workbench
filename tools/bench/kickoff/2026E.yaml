scoring_items:
- text: ，拼图区域为纵向 A4 纸张，碎片随机摆放在纸张的上半区域，装置将碎片移动到纸张的下半区域并完成拼图。分界线A4纸张图 1 拼图示意图二、 要求1. 选手自备 A4 纸张和图 2 所示尺寸的 4 片碎片，均要求为纯色。A4 纸张颜色自定，上、下区域有明显的分界线（实线宽度不大于 5mm）；碎片颜色自定，且 4 片碎片颜色一致；碎片材质不限，厚度不大于 2mm，其上无任何元器E- 1 /
    3件；碎片移动方式不限。在 2 分钟的时间内一次性完成下面两项操作。2cm          8cm2cm 1cm3cm图 2 选手自备碎片（1）装置能将所有碎片从 A4 纸的上半区域移动到 A4 纸的下半区域
  points: 20
- text: （2）装置能将碎片拼接成目标矩形，要求碎片位置正确、碎片不重叠、相邻碎片对应顶点的距离均不大于 2cm
  points: 30
- text: 2. 使用选手自备的 A4 纸张，拼接测评现场提供的待拼接碎片。现场提供的待拼接碎片：数量不大于 4 片；每片边数不大于 5 条，每条边长均不小于 2cm；每片至少有 1 条边位于目标矩形的外边上；碎片由镀锌薄铁片（厚度约 0.3mm）上面黏贴纸片组成，总厚度不大于 2mm，重量不大于 30g。目标矩形的尺寸为9cm×5cm ~ 12cm×9cm 之间。（1）测评现场提供的待拼接碎片上的纸片颜色均为白色。装置能将碎片拼接成目标矩形，要求碎片位置正确、碎片不重叠、相邻碎片对应顶点的距离均不大于
    2cm，时间不大于 2 分钟
  points: 20
- text: （2）测评现场提供待拼接碎片上的纸片图案为白底扑克牌牌面。装置能将碎片拼接成目标矩形，要求碎片位置正确、碎片不重叠、相邻碎片的花纹对应正确，相邻碎片对应顶点的距离均不大于 2cm，时间越短越好、最长不大于 2 分钟
  points: 30
- text: 3. 设计报告
  points: 20
