scoring_items:
- text: ，由专人封存。周期信号测量分析装置（G 题）一、任务设计制作周期信号测量分析装置（以下简称为装置），可对信号源输出的周期信号 u 进行测量与分析，信号源输出阻抗为 50Ω。装置既能在显示屏上稳定显示 u 的波形图或电压频谱图，也能稳定显示 u 的时域或频域相关参数值，频率分辨率 500Hz。装置组成框图如图 1 所示。图 1 装置组成框图二、要求1. 装置输入 u  ua ，其电压
    峰峰值 Upp =100mV~250mV，所有频率成分均在10kHz~200kHz 范围内。下列四项要求在启动装置后，每一项完成时间不超过 2 秒。（1）键控选择一屏显示 ua 的 1 个或者 3 个完整周期波形
  points: 6
- text: （2）显示 ua 的电压峰峰值 Upp 、有效值 Urms ，误差的绝对值均≤5mV；显示 ua 的基频值 f a1 ，误差的绝对值≤1kHz
  points: 13
- text: （3）定性显示 ua 的电压频谱图
  points: 5
- text: （4）显示 ua 的电压频谱各分量的幅值，误差的绝对值≤5mV
  points: 9
- text: 2 ． 装 置 输 入 u  ub ， 其 电 压 峰 峰 值 为 50mV~250mV ， 所 有 频 率 成 分 均 在G- 1 / 310kHz~500kHz 范围内。下列四项要求在启动装置后，每一项完成时间不超过 2 秒。（1）键控选择一屏显示 ub 的 1 个或者 3 个完整周期波形
  points: 6
- text: （2）显示 ub 的电压峰峰值 Upp 、有效值 Urms ，误差的绝对值均≤5mV；显示 ub 的基频值 f b1 ，误差的绝对值≤1kHz
  points: 13
- text: （3）定性显示 ub 的电压频谱图
  points: 5
- text: （4）显示 ub 的电压频谱各分量的幅值，误差的绝对值≤5mV
  points: 9
- text: 3．装置输入 u  ub  uJ ，其中被测信号 ub 的电压峰峰值为 50mV~250mV，所有频率成分均在 10kHz~500kHz 范围内；单频干扰 uJ 的电压峰峰值为 200mV、频率 f J≥1MHz。要求装置能在抑制单频干扰 uJ 影响的基础上，完成下列四项要求，在启动装置后，每一项完成时间不超过 2 秒。（1）键控选择一屏显示 ub 的 1 个或者 3 个完整周期波形
  points: 6
- text: （2）显示信号 ub 的电压峰峰值 Upp 、有效值 Urms ，误差的绝对值均≤5mV；显示ub 的基频值 f b1 ，误差的绝对值≤1kHz
  points: 15
- text: （3）定性显示 ub 的电压频谱图
  points: 5
- text: （4）显示 ub 的电压频谱各分量的幅值，误差的绝对值≤5mV
  points: 8
- text: 4．设计报告
  points: 20
thresholds:
