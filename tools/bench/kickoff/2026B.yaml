scoring_items:
- text: '       载                               无线读表器图 1 系统框图B- 1 / 3二、 要求1. 自制的电流表如图 1 所示，电路 A 和电路 B 须采用电磁耦合方式获取电能，为本电流表唯一供电；图 1 中取电传感部分的初级绕组匝数 N1≤5，初级线圈的绕组在作品中能清晰可见，匝数可查；次级绕组匝数不限制。在制作的电流表上设置 4 位编码开关，用于设置本电流表地址编号。电流表的电路
    B 为可插拔的低功耗无线传输模块，电路 B 拔除后，电路 A 能正常工作。要求：（1）电流表测量范围为 0.1~2A，显示值为有效值；与标定的电流表读数相对误差绝对值≤0.5%'
  points: 30
- text: （2）电路 A 采用低功耗设计，电流表启动工作的负载电流越小越好
  points: 20
- text: （3）电流表的启动时间越短越好
  points: 20
- text: 2. 自制的读表器如图 1 中的电路 C 所示，读表器能通过无线方式读取电流表数据，电路对功耗不作严格要求，使用电池供电。要求：（1）读取距离≥5m
  points: 3
- text: （2）读取数据功能：基本模式和自动模式读取电流表读数。基本模式：即一对一读取，不操作电流表，但允许操作读表器，手动读取；自动方式：能自动搜索其无线覆盖范围内的电流表，每 2 分钟自动采集一次，读表器一键启动，电流表除地址码设置外，不得操作其他功能键
  points: 10
- text: （3）报警指示功能：负载电流小于 0.2A 时低限报警，大于 2A 超限报警，负载断开后离线指示
  points: 5
- text: （4）具有数据储存、查看历史数据、显示电流变化趋势曲线的能力；数据记录中包括读取时间、电流表编号（或地址）、电流值、是否超限等信息，至少能存储 30条信息以上。具有数据掉电保护的功能
  points: 8
- text: 3. 其他
  points: 4
- text: 4. 设计报告
  points: 20
