id: 2026F
title: 2026 F 李萨如图形显示控制装置
source: /workspace/nuedc/F题_李萨如图形显示控制装置.pdf
_doc: 读题开局用例的标准答案：由 PDF 自动抽取（pdftotext，按“（N 分）”切分），入库后需人工核对。
total_points: 120
scoring_items:
- text: 1 所示。图中信号源采用成品。信号源输出一个正弦信号，同时输入到示波器 X 轴和装置，装置通过相应信号处理，产生一个输出信号到输入示波器 Y 轴，控制李萨如图形形状。信号源输出信号的频率范围为 1kHz~100kHz，频率步进为 100Hz。示波器 X、Y 轴的通道灵敏度均为 0.5V/div。X轴   Y轴信号源摄像头李萨如图形显示控制装置图 1 李萨如图形显示控制装置连接关系图二、
    要求1. 装置设有输入、输出直通模式。在该模式下，调节信号源的输出幅度，使示波器显示的李萨如图形为一个 8×8div 大小矩形的对角线。后续要求信号源幅F- 1 / 3度和示波器通道灵敏度均保持在此状态不能改变
  points: 5
- text: 2. 装置的输出信号与其输入信号相位正交，幅度相等。使得李萨如图形为直径为 8div 的圆（如果示波器垂直和水平方向 1div 长度不相等，该图形会变成椭圆）。幅度误差的绝对值≤0.2div
  points: 15
- text: 3. 装置的输出信号为输入信号频率的 2 倍，幅度相等。使得李萨如图为“∞”形。要求图形上下左右对称，幅度误差的绝对值≤0.2div
  points: 25
- text: 4. 可以设置装置输出信号的峰峰值，使示波器 Y 轴方向图形峰峰幅度分别为 2、4、6 和 8div。幅度误差的绝对值≤0.2div
  points: 15
- text: 5. 断开信号源与装置的连接。通过 3 个独立启动按钮键，一键启动装置分别进入下面的 3 个自动模式。装置通过摄像头拍摄示波器的图形，自动控制装置的输出，使示波器分别完成前面 1，2 和 3 要求的对角线、圆（或椭圆）和“∞”形 3 个李萨如图形的显示功能。完成后声光提示，控制时间≤10s，稳定时间≥5s
  points: 40
- text: 6. 设计报告
  points: 20
thresholds:
- ≤0.2div
- ≤10s
- ≥1div
- ≥5s
