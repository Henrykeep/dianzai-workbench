scoring_items:
- text: 行驶，行驶过程中钢球可在滚球运动控制装置内保持相对稳定，如图 1 所示。车载平衡滚球运动控制系统由小车、带凹槽的摆杆、摆杆控制机构和钢球组成，如图 2 所示，摆杆左端用铰链或者合页固定，距离小车平板高度 h≥5cm，另一端连接至摆杆角度控制机构，可控制钢球稳定在指定位置。图 1 小车行驶路线示意图H- 1 / 4图 2 车载平衡滚球运动控制系统结构参考示意图二、 要求1. 安装摆球位置监测图传装置。装置由发送和接收模块组成，图传发送模块须稳固安装在小车上，接收模块可连接显示存储装置并整体置于环形线路以外，要求能稳定实时显示钢球在凹槽中滚动的画面，并完整记录每次测试时钢球运动的视频且能按要求回放
  points: 6
- text: 2. 小车置于 A 点，按键启动后沿黑线顺时针行驶一圈并停到 A 点，计时停止并显示行驶总时间，要求行驶总时间≤20s，停车偏差≤2cm
  points: 16
- text: 3. 小车在静止状态时，要求摆杆控制装置控制小球从摆杆中心点 O 往+5cm处运行，到达后折返，再运行到-5cm 处并稳定在该点附近，要求运行时间≤5s，±5cm 处的最大误差绝对值≤1cm
  points: 13
- text: 4．小车置于 A 点，钢球置于中心点 O，按键启动后沿黑线顺时针行驶并通过 B 位置，AB 间行驶时间≤8s，行驶过程中钢球须稳定在摆杆中心点附近，误差绝对值≤1cm
  points: 20
- text: 5. 小车置于 A 点，钢球置于中心点 O，按键启动后沿黑线顺时针行驶一圈并通过 A 位置，整圈行驶总时间≤30s，要求行驶过程中钢球须稳定在摆杆中心点附近，误差绝对值≤1cm
  points: 20
- text: 6. 小车置于 A 点，钢球置于摆杆任意指定位置，按键启动后沿黑线顺时针行驶一圈并通过 A 位置，整圈行驶总时间≤30s，要求行驶过程中钢球能稳定在摆杆上的任意指定位置附近，误差绝对值≤1cm
  points: 20
- text: 7. 其他
  points: 5
- text: 8. 设计报告
  points: 20
