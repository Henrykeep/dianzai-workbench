scoring_items:
- text: 会打开声光提示。当通过验证的数字钥匙进入到开锁区，智能门锁会自动开锁。当通过验证的数字钥匙离开开锁区时，智能门锁会自动闭锁。当通过验证的数字钥匙离开迎宾区时，智能门锁会关闭声光提示。数字钥匙独立设计制作，要求尺寸不得大于 12cm×8cm×4cm，且采用电池供电；也可以利用便携式智能终端进行功能扩展来实现，比如利用手机加载应用软件来实现。智能门锁应带有显示功能，要求尺寸不得超过 60cm
    直径×30cm 高度的圆柱体大小。二、 要求1.数字钥匙一键启动后能持续发送用于身份验证的 ID 信息，智能门锁能对进入感应区的数字钥匙进行检测，接收数字钥匙发送的 ID 信息并显示。要求通信距离不小于 3m
  points: 20
- text: 3. 智能门锁能对检测到的数字钥匙进行定位，测量径向距离和方位角。径向距离误差绝对值不大于 0.3m，方位角 误差绝对值不大于 10°
  points: 30
- text: 4. 智能门锁能准确判定数字钥匙是否进入迎宾区或离开迎宾区，并给出声光提示。要求迎宾区范围判定误差绝对值不大于 0.2m
  points: 18
- text: 5. 智能门锁能准确判定数字钥匙是否进入开锁区或离开开锁区，并执行开锁或闭锁动作。要求开锁区范围判定误差绝对值不大于 0.2m
  points: 18
- text: 6. 智能门锁可以手动修改身份 ID 信息，并对数字钥匙是否为修改后的身份 ID 进行识别，并显示识别结果
  points: 10
- text: 7. 其他
  points: 4
- text: 8. 设计报告
  points: 20
