_doc: 读题开局用例的标准答案：由 PDF 自动抽取（pdftotext，按“（N 分）”切分），入库后需人工核对。
total_points: 120
scoring_items:
- text: 资，从 A 点出发循线顺时针行进完整一圈，行进过程中不得停车；地面站能实时显示相关信息。图 1 为一个大小为 400cm×500cm的场地俯视图。左下角 H 点为无人机起降点。A 点为小车出发点和终点，有一根 40cm 的黑色线作为出发点标识，场地中央闭合的黑色线为小车循线轨迹。图 2 为小车平台中心的降落指示图案。D- 1 / 4二、 要求1. 抛投任务要求（1）小车一键启动，从 A
    点出发顺时针循黑色轨迹行走一圈；小车启动时，小车发送无线指令使无人机在起降点自动垂直起飞，升至 150±10cm 高度稳定悬停 3 秒；随后无人机保持巡航高度飞行至小车上方，需要在小车到达 B 点前形成伴飞状态
  points: 15
- text: （2）伴飞期间，无人机自主抛投一个 25±5 克的软质物体到小车平台中心；抛投过程需在小车行走至 D 点前完成
  points: 20
- text: （3）无人机完成抛投后，以巡航高度返回起降点上方，平稳准确降落在起降点；小车继续行驶至 A 点后停止
  points: 15
- text: （4）任务（1）-（3）需在小车启动后 90 秒内完成
  points: 10
- text: 2. 动态起降任务要求（1）小车、无人机放回出发点、起降点；小车一键启动，从 A 点出发顺时针循黑色轨迹行走一圈；小车启动后，需在 15 秒内行走至 B 点；无人机在起飞点垂直起飞，升至 150±10cm 高度后巡航寻找小车位置；发现小车后定高巡航至小车上方，然后稳定降落至小车平台上，降落过程需在小车行走至 D 点前完成，启动至完成降落动作的用时越短越好
  points: 10
- text: （2）无人机在小车平台上停留 5 秒后自主起飞，恢复巡航高度，返回起降点上方，平稳准确降落在起降点；小车继续循线行进至 A 点停车，小车全程行进时间不超过 90 秒
  points: 10
- text: 3. 上述任务过程中，地面站能图形化实时显示无人机和小车在场地内的位置等信息，并能以文字方式显示无人机的实时状态（伴飞、抛投、降落、起飞等）
  points: 15
- text: 4. 其他
