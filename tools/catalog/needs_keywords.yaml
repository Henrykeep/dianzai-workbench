# 读题关键词 → 能力标签（tools/req.py init 据此给每个评分项起草 needs；scheme.py 按 needs 选型）。
# 通用表，不针对某一题：题目里出现左边任一关键词，就给该项打上这个标签。可随便增删改；改完重跑 req.py init。
# 标签尽量用 tools/catalog/parts.yaml 里的 provides；库里还没有的标签也可以写，scheme.py 会提示“库里没有候选”。
# 写法：标签: [关键词, ...]；关键词是普通子串（不区分大小写）。
