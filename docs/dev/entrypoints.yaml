# 入口规则表：每个用户动作 → 恰好一个入口（时间线一步 / 工具箱一类 / 常驻）。
# tools/check_entrypoints.py 在 make check 里检查：动作/标签/界面元素不重复；侧车每个 op 有界面或 Agent 调用方
# （或写进 script_ops 并说明为什么）；界面调用的每个 op 都在这里登记；Agent 工具都有归属步。
# 依据：/workspace/walk/LOGIC_AUDIT.md §3.1（时间线导航）、§3.3（入口唯一 + op 无孤儿）。
# ready: false = 入口已登记、功能未就绪（如等固件支持）；不写 = 已就绪。
# at 写法：step:<步> | toolbox:<类> | always:<常驻件> | nav:<导航件> | page:<旅程 id>（页内具名区域，index.html 用 data-region 标）| <区域>:（独立区域，在 regions 里声明，如告警条 alerts:）。
#   ui = index.html 里的元素 id；独立区域入口写区域选择器 [data-region="<区域>"]（区域固定在 index.html，里面的按钮由 ts 生成）。dynamic: true = 由 ts 动态生成、无固定位置（尽量不用）。

# 步骤导航位置：左侧 aside.nav #steps。用户看到 7 步旅程（选题与方案→建工程→仿真→上板联调[含标定]→调参→评分→封箱，id 见 app/ui/src/progress.ts JOURNEY）；下面 steps 是内部页面键。
steps:     [项目, 烧录, 模块, 联调, 标定, 调参, 评分, 封箱]
toolbox:   [测量, 串口, 记录, 帧格式, 协处理器, 设置]
always:    [急停, 连接, 排障]
regions:   [alerts]   # 独立区域（index.html data-region="alerts"：顶部告警条）
nav:       [进度]   # 左侧导航 aside.nav：流程步骤 #steps 与下一步提示
page:      [req, tune, seal]   # 页内具名区域 data-region page:req：读题页没有当前项目（project 为 null）时的空状态「新建项目 / 打开项目」；page:tune = 调参页页头「保存参数」；page:seal = 封箱页运行模式区

actions:
  # ── 常驻 ──
  - {id: estop,        label: 急停,             at: always:急停, ui: estop,      ops: [estop]}
  - {id: estop_clear,  label: 解除急停,         at: always:急停, ui: cmd-r,      ops: [cmd]}
  - {id: connect,      label: 连接/断开,        at: always:连接, ui: connect,    ops: [connect, disconnect, list_ports, serial_lines, hello]}
  - {id: auto_rc,      label: 自动重连,         at: always:连接, ui: auto-rc,    ops: [auto_reconnect]}
  - {id: link_health,  label: 链路心跳条,       at: always:连接, ui: hbstrip,    ops: [health, timeline]}
  - {id: alerts,       label: 告警确认,         at: "alerts:", ui: '[data-region="alerts"]', ops: [alert_ack]}   # 告警条（#alerts）里的“知道了”，由 main.ts renderAlerts 生成
  - {id: progress,     label: 项目进度,         at: nav:进度,    ui: steps,      ops: [progress.get]}   # #steps 各步状态 + 阻塞项（progress.ts 渲染，另订阅推送 progress.changed）；每页顶部 #pg-head 主按钮同源
  - {id: symptoms,     label: 按症状排查,       at: always:排障, ui: sym-open,   ops: []}
  - {id: doctor,       label: 自检,             at: always:排障, ui: doctor,     ops: [doctor]}
  - {id: blackbox,     label: 读黑匣子,         at: always:排障, ui: pre-bbtn,   ops: [blackbox]}
  # 进度阻塞项的修复按钮（进度条按 fix_action 动态生成）。ready: false = 入口已登记但功能未就绪（界面置灰，侧车返回 not_ready）
  - {id: fetch_deps,   label: 一键安装依赖,     at: always:排障, ui: doc-list,   ops: [fetch_deps]}   # 固定在自检对话框 #doc 的结果列表（missing_deps 的 fix_action 跳到自检）
  # ── 项目 ──
  - {id: project_new,  label: 新建项目,         at: page:req,   ui: pj-new,     ops: []}   # 只把焦点移到一句话输入（project_ask），不另起新建流程
  - {id: project_open, label: 打开项目,         at: page:req,   ui: pj-open,    ops: [project.list, project.open]}   # 列表按钮 .pj-item 是这一入口的选项，选中即 project.open {code}
  - {id: project_sample, label: 从示例开始,       at: page:req,   ui: pj-sample,  ops: [project_switch_example]}   # 例题只读：复制出新项目，回 project_forked
  - {id: project_ask,  label: 一句话新建工程,   at: step:项目,   ui: pj-ask-go,  ops: []}   # 只读 agent_config 判断是否已配置，配置入口仍是 llm_cfg
  - {id: project_flow, label: 读题到生成引导,   at: step:项目,   ui: pflow,      ops: [flow_preview, flow_accept]}
  # ── 烧录 ──
  - {id: build,        label: 编译,             at: step:烧录,   ui: fw-build,   ops: [build]}
  - {id: flash,        label: 烧录,             at: step:烧录,   ui: fw-flash,   ops: [flash]}
  - {id: fw_rollback,  label: 回滚固件,         at: step:烧录,   ui: fw-rollback, ops: [flash_rollback]}
  - {id: probe,        label: 调试探针设置,     at: step:烧录,   ui: fw-probe,   ops: [probe_config_get, probe_config_set]}
  # ── 模块 ──
  - {id: raw,          label: 原始收发,         at: step:模块,   ui: raw,        ops: [raw_monitor]}
  - {id: send,         label: 发送,             at: step:模块,   ui: snd-go,     ops: [send_raw]}
  - {id: presets,      label: 常用指令,         at: step:模块,   ui: snd-presets, ops: [preset_save, preset_send, preset_timer, preset_trigger, preset_delete, preset_list]}
  - {id: board_cmd,    label: 板端命令,         at: step:模块,   ui: cmd-send,   ops: [cmd]}
  - {id: elf_watch,    label: ELF 变量观察,     at: step:模块,   ui: elf-go,     ops: [elf_symbols, watch_start, watch_stop]}
  # ── 联调 ──
  - {id: scope,        label: 示波,             at: step:联调,   ui: pb,         ops: []}
  - {id: fft,          label: 频谱,             at: step:联调,   ui: fft,        ops: [fft]}
  - {id: event_tl,     label: 事件时间线,       at: step:联调,   ui: tl,         ops: [replay_ctl]}
  # ── 标定 ──
  - {id: cal_polarity, label: 极性自检,         at: step:标定,   ui: calwiz,     ops: [polarity_check]}
  - {id: cal_sensors,  label: 传感器标定,       at: step:标定,   ui: cal-props,  ops: [wave_measure, propose, proposal_decide]}
  # ── 调参 ──
  - {id: params,       label: 参数编辑与下发,   at: step:调参,   ui: p-send,     ops: [param_set, param_read_all]}
  - {id: snap_save,    label: 存快照,           at: step:调参,   ui: snap-save,  ops: [snapshot_save, snapshot_list]}
  - {id: restore,      label: 回到…,            at: step:调参,   ui: p-def,      ops: [params_restore, tune_best]}
  - {id: step_test,    label: 阶跃实验,         at: step:调参,   ui: ag-step,    ops: [tune_step_test]}
  - {id: sp_restore,   label: 恢复急停前目标,   at: page:tune,   ui: sp-restore, ops: [setpoint_set]}
  - {id: it_go,        label: 自动迭代,         at: step:调参,   ui: it-go,      ops: [iterate_start, iterate_cancel, iterate_status]}   # #62：停止迭代同一按钮；iterate_status 连上 / 刷新时补状态；结果卡确认走 agent_action_decide
  - {id: tune_relay,   label: 自整定,           at: step:调参,   ui: ag-relay,   ops: [tune_relay]}
  - {id: sweep_test,   label: 扫频,             at: step:调参,   ui: ag-sweep,   ops: [tune_sweep_test]}
  - {id: search,       label: 仿真搜索,         at: step:调参,   ui: ag-search,  ops: [tune_search, propose]}
  - {id: analyze,      label: 分析阶跃,         at: step:调参,   ui: ag-tune,    ops: [tune_analyze, propose]}
  - {id: rule,         label: 规则建议,         at: step:调参,   ui: ag-rule,    ops: [tune_rule_round]}
  - {id: proposals,    label: 提议卡采纳,       at: step:调参,   ui: props,      ops: [proposal_decide, agent_action_decide, change_decide, rollback]}
  - {id: pretune,      label: 调参前问答,       at: step:调参,   ui: ag-pre,     ops: [pretune_get, pretune_set]}
  - {id: guard_reset,  label: 重置护栏,         at: step:调参,   ui: ag-guard,   ops: [tune_reset]}
  - {id: agent_chat,   label: Agent 助手,       at: step:调参,   ui: ag-form,    ops: [agent_ask, agent_reset, agent_set_mode, agent_journal, agent_tune_finish, commit_confirm]}   # commit_confirm：#88 提交确认卡（Agent 面板里）
  - {id: agent_undo,   label: 撤销 Agent,       at: step:调参,   ui: ag-undo,    ops: [agent_undo]}
  # ── 评分 ──
  - {id: score,        label: 评分项逐项验收,   at: step:评分,   ui: score,      ops: [score_items, score_save, score_writeback]}
  # ── 封箱 ──
  - {id: precontest,   label: 赛前全绿检查,     at: step:封箱,   ui: pre,        ops: [precontest, precontest_export]}
  - {id: run_mode,     label: 切换运行模式,     at: page:seal,   ui: seal-mode,  ops: [set_run_mode]}   # 先 confirmed=false，needs_confirm 出确认卡，人确认后 confirmed=true；Agent 只给跳转（human_only）
  - {id: enable_cloud, label: 比赛模式启用云端, at: toolbox:设置, ui: cloud-enable, dynamic: true, human_only: true, ops: [set_cloud_enabled]}   # 合规底线：只能由人——先 confirmed=false 出确认卡，人确认后 confirmed=true；Agent 只给 goto settings:cloud（human_only）。界面入口待前端接（settings:cloud）；没接上前界面查不到 #cloud-enable，进度条/错误卡按“无元素”不出可点按钮（前端测试禁止 ready: false 行）
  - {id: run_selftest, label: 板上自检,         at: page:tune,   ui: seal-selftest, ops: [run_selftest]}   # 也是进度阻塞项 selftest_fail 的修复动作；固件没报时照写 selftest_unreported 的原因 + 处理
  - {id: params_flash, label: 存参数到 flash,   at: page:tune,   ui: tb-save,    ops: [save_params]}   # 调参页页头常驻；也是进度阻塞项 params_not_saved 的修复动作。原赛前检查对话框里的 cmd W 按钮已去掉（一个功能一个入口）
  - {id: readback,     label: 回读参数文件,     at: step:封箱,   ui: p-rb,       ops: [params_readback]}
  - {id: yaml_wb,      label: 写回 yaml,        at: step:封箱,   ui: ag-yaml,    ops: [yaml_writeback]}
  # ── 工具箱 ──
  - {id: wave_meas,    label: 波形测量,         at: toolbox:测量, ui: tb-meas,   ops: [wave_measure]}
  - {id: cursors,      label: A/B 光标,         at: step:联调,   ui: meas,      ops: []}
  - {id: serial_ln,    label: 串口线控,         at: toolbox:串口, ui: lines-btn, ops: [serial_modem, serial_lines_set, serial_pulse, serial_stall]}
  - {id: log_replay,   label: 回放记录,         at: toolbox:记录, ui: replay,    ops: [log_list, replay, replay_ctl]}
  - {id: log_export,   label: 导出记录,         at: toolbox:记录, ui: export,    ops: [log_export]}
  - {id: log_import,   label: 导入记录,         at: toolbox:记录, ui: import,    ops: [log_import, replay]}
  - {id: framedef,     label: 非工作台帧格式,   at: toolbox:帧格式, ui: framedef, ops: [framedef_set, framedef_status]}
  - {id: coproc,       label: 协处理器部署,     at: toolbox:协处理器, ui: fw-coproc, ops: [coproc_get, coproc_set, coproc_push, coproc_start, coproc_stop, coproc_status, coproc_log]}
  - {id: llm_cfg,      label: 大模型设置,       at: toolbox:设置, ui: ag-cfg,    ops: [agent_config, agent_config_test, agent_models, agent_ollama]}

# 同一个 op 被多个动作用、且不算重复入口的（每个写清楚为什么）
shared_ops:
  cmd: 板端单字符命令通道：解除急停（'R'）、存 flash（'W'）、手发命令共用一条帧，动作各不相同
  replay_ctl: 回放控制；时间线点一条 = 跳到那一刻（同一回放，不是第二个入口）
  replay: 导入后直接回放
  wave_measure: 工具箱“波形测量”和标定向导录一段求平均用同一个只读测量
  proposal_decide: 提议卡在调参页 Agent 栏和标定页各显示（同一种卡，按 source 分栏），确认都走它
  propose: 规则建议 / 分析阶跃 / 仿真搜索三条路的候选都落成同一种提议卡（source 字段区分来源），外部脚本也走它
  params_restore: 回到…（默认 / 最好一轮）和快照页“恢复”是同一个恢复 op，只是 source 不同

# 不在界面上、故意保留的 op（脚本 / 测试接口）
script_ops:
  send_data: 按 id + hex 发一帧 DATA：测试和外部脚本驱动板子（界面用“发送”的 send_raw / 常用指令）
  agent_tool: 外部 Agent（脚本 / MCP 桥）调参数工具；内置 Agent 走 agent_ask
  project_chain: 项目页“一键走完 ①–⑤ + Keil 注入”的后端（整链只写暂存区预览）；入口按钮由前端（frontend-polish）接，接上后从这里移走
  quick_start: 一句话起项目（输入框）→ 整链预览 + 一张确认卡；确认后连仿真板、一键起步调参、评分。输入框由前端接，接上后从这里移走
  project_apply: 同上，把 project_chain 的预览一次写入（界面那一下点击就是确认）
  project.migrate: 旧版写在仓库 examples/ 的用户工程复制到 $DZBENCH_HOME/projects/（#29，只复制、不删源）；不带 confirmed 只返回清单（needs_confirm），界面确认卡确认后 confirmed=true 才复制。确认卡由前端接（page:req），接上后移到 actions

# 内置 Agent 工具 → 归属步（Agent 是所在页的助手，不单独占菜单）
agent_tools:
  step:调参: [read_telemetry, list_params, step_analysis, propose_param_change, tune_context, observe, run_step_test, run_sweep_test, bode_predict, rollback_best, tune_autopilot, iterate_start, iterate_cancel]
  step:烧录: [flash, flash_rollback, build, build_log, board_memory]
  always:排障: [decode_hardfault, read_symbol]
  step:项目: [repo_map, remember, list_files, read_file, propose_edit, change_status, update_plan, project_state, progress_get, flow_preview, flow_accept, project_chain, project_apply, quick_start]
  nav:进度: [project_list, project_open]
  step:评分: [score_items, score_run, score_save, score_writeback]
  step:标定: [polarity_check]
  step:联调: [fft, wave_measure]
