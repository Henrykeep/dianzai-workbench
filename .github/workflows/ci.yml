# 每次推送（任何分支、任何路径）都跑：make check（含 check_version）+ make test + make compat。
# 2026-10-29 教训：main 坏了两次（测试依赖本机已下载的器件包；CHANGELOG 版本和代码不一致），都是 CI 没跑 make check 漏掉的。
# 本地等价物：make preflight（干净克隆、无缓存包）。
name: ci
on:
  push:
  pull_request:
  workflow_dispatch:
env:
  TUNEGATE_SOURCE: randplant   # #78 随机对象门禁默认真 randplant；替身只给单元测试显式选用

jobs:
  check-test:
    runs-on: ubuntu-latest
    timeout-minutes: 45   # 实测整 job 28–39 分钟（make test 23–34）；卡死时快速失败，单测另有 pytest-timeout 120 s（tests/conftest.py）
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with: { python-version: "3.12" }
      - run: pip install pyyaml jsonschema -r app/sidecar/requirements.txt -r tools/wheelhouse.txt -r tools/requirements-hw.txt
      - run: sudo apt-get update && sudo apt-get install -y graphviz   # WireViz 出图要 dot
      - name: 缓存 Arm GNU Toolchain 13.3.rel1
        uses: actions/cache@v4
        with: { path: /opt/arm/arm-gnu-toolchain-13.3.rel1-x86_64-arm-none-eabi, key: arm-gnu-toolchain-13.3.rel1-x86_64 }
      - name: Arm GNU Toolchain 13.3.rel1（官方 tarball + sha256，锁版本，见 tools/arm_toolchain.sh）
        run: |
          sudo mkdir -p /opt/arm && sudo chown "$USER" /opt/arm
          tools/arm_toolchain.sh --install
          echo /opt/arm/arm-gnu-toolchain-13.3.rel1-x86_64-arm-none-eabi/bin >> "$GITHUB_PATH"
          tools/arm_toolchain.sh --check
      - name: 缓存 TI SysConfig CLI 1.28.0.4712
        uses: actions/cache@v4
        with: { path: third_party/sysconfig_1.28.0, key: sysconfig-1.28.0.4712-linux-x86_64-v1 }
      - name: TI SysConfig CLI（官方免登录下载 + sha256 锁定 + unattended 安装，见 tools/fetch_sysconfig.sh）
        run: |
          tools/fetch_sysconfig.sh
          test -x third_party/sysconfig_1.28.0/sysconfig_cli.sh && test -f third_party/sysconfig_1.28.0/dist/cli.js
          echo "SYSCFG_CLI=$PWD/third_party/sysconfig_1.28.0/sysconfig_cli.sh" >> "$GITHUB_ENV"
      - run: tools/fetch_third_party.sh mspm0 f4 f1 freertos stm32pins                     # 和 preflight 一样有全套 SDK：test_mspm0_board、从零新建（F1/F4 HAL）、FreeRTOS 板导入编译
      - uses: actions/setup-node@v5                                            # make check 的许可扫描要读 app/ui/node_modules
        with: { node-version: "22", cache: npm, cache-dependency-path: app/ui/package-lock.json }
      - run: npm ci
        working-directory: app/ui
      - run: make check
      - run: make test
      - name: MSPM0 从零新建（SysConfig 求解器）必须真跑，不许跳过
        run: |
          python -m pytest -q -rs app/sidecar/tests/test_projflow.py::test_scratch_mspm0_syscfg 2>&1 | tee /tmp/sc.log
          grep -q "1 passed" /tmp/sc.log && ! grep -qi skipped /tmp/sc.log || { echo "::error::test_scratch_mspm0_syscfg 没真跑（平台缺工具、未验证）"; exit 1; }
      - name: 随机对象整定门禁（make tunegate：假达标硬、通过率软）
        run: |
          t0=$(date +%s)
          make tunegate
          echo "tunegate 用时 $(( $(date +%s) - t0 )) s" | tee -a "$GITHUB_STEP_SUMMARY"
      - run: make compat
