# 芯台 Windows 安装包：一个 NSIS 安装包（装到 %LOCALAPPDATA%，含 repo\ 工程仓库 + 编好的 Windows 仿真板 + PDF 读题）
# 产物：artifact dzbench-windows；main / 手动触发时同时更新草稿预发布 win-latest（草稿不建 tag）
name: app-windows
on:
  workflow_dispatch:
  push:
    branches: [main, integration]  # integration 也跑，验收要 Windows 结果（#77）； 每次推 main 都跑 Windows：只有 main 的 Windows 绿了才打 tag（v0.8.0 教训）
    tags: ["app-v*", "v*"]
permissions:
  contents: write             # 草稿预发布
env:
  TUNEGATE_SOURCE: randplant   # #78 随机对象门禁默认真 randplant；替身只给单元测试显式选用

jobs:
  sidecar-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with: { python-version: "3.12" }
      - run: pip install -r app/sidecar/requirements.txt -r tools/wheelhouse.txt
      - run: bash tools/fetch_third_party.sh f4 f1 freertos mspm0   # 从零新建测试要 HAL 模板
      - run: bash tools/fetch_sysconfig.sh            # test_scratch_mspm0_syscfg 要 SysConfig CLI（锁版本 + sha256）
      - name: Arm GNU Toolchain 13.3.rel1（test_toolchain 的 ELF 符号/实时观察要 arm-none-eabi-gcc）
        run: |
          sudo mkdir -p /opt/arm && sudo chown "$USER" /opt/arm
          tools/arm_toolchain.sh --install
          echo /opt/arm/arm-gnu-toolchain-13.3.rel1-x86_64-arm-none-eabi/bin >> "$GITHUB_PATH"
      - run: make BOARD=host-sim APP=car_2wd && make BOARD=host-sim APP=2026H_ball
      - run: python -m pytest -rs -v app/sidecar/tests   # e2e 需要 host-sim（make + cc，ubuntu 自带）
  win-repo:                   # repo\ + mingw 交叉编的仿真板（Windows runner 上没有现成 make + gcc 组合）
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with: { python-version: "3.12" }
      - run: sudo apt-get update && sudo apt-get install -y gcc-mingw-w64-x86-64 && pip install pyyaml jsonschema
      - run: bash tools/stage_win_repo.sh "$RUNNER_TEMP/dz-repo"
      - uses: actions/upload-artifact@v4
        with: { name: dz-repo, path: "${{ runner.temp }}/dz-repo", include-hidden-files: true }
  build:
    needs: [sidecar-test, win-repo]
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with: { python-version: "3.12" }
      - uses: actions/setup-node@v5
        with: { node-version: "22", cache: npm, cache-dependency-path: app/ui/package-lock.json }
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with: { workspaces: app/src-tauri }
      - uses: actions/download-artifact@v4
        with: { name: dz-repo, path: app/dz-repo }
      - run: npm ci                    # 先装前端依赖：许可扫描/UI 单测要 node_modules（setup-node 已按 lock 缓存）
        working-directory: app/ui
      - name: Arm GNU Toolchain 13.3.rel1（Windows 版 zip，锁版本 + sha256；test_toolchain 要 arm-none-eabi-gcc）
        shell: bash
        run: |
          f=arm-gnu-toolchain-13.3.rel1-mingw-w64-i686-arm-none-eabi
          curl -fsSL -o "$RUNNER_TEMP/$f.zip" "https://developer.arm.com/-/media/Files/downloads/gnu/13.3.rel1/binrel/$f.zip"
          echo "e46fda043c0ce83582bc8db4b3ef85f77f4beb7333344c2f4193c17e1167a095  $RUNNER_TEMP/$f.zip" | sha256sum -c -
          unzip -q "$RUNNER_TEMP/$f.zip" -d "$RUNNER_TEMP/arm"
          g=$(find "$RUNNER_TEMP/arm" -name arm-none-eabi-gcc.exe | head -1); test -n "$g"
          cygpath -w "$(dirname "$g")" >> "$GITHUB_PATH"
      - name: 单元测试（Windows 上自动跳过仿真 e2e）
        shell: bash
        env:
          PYTHONUTF8: "1"   # 打包后的 dzbench.exe 也会设；子进程工具脚本输出中文不炸 cp1252
        run: |
          bash tools/fetch_third_party.sh f4 f1 freertos mspm0
          pip install -r app/sidecar/requirements.txt -r tools/wheelhouse.txt pyinstaller
          arm-none-eabi-gcc --version | head -1
          python -m pytest -rs -v app/sidecar/tests
      - name: keil_inject 自测（make check 里那份，含跨盘符；先观察，不挡打包）
        shell: bash
        continue-on-error: true
        env: { PYTHONUTF8: "1", CUBE_HAL: "" }
        run: python tools/test_keil_inject.py
      - name: 缓存 MSPM0 器件包（key 绑定 fetch_third_party.sh 里锁定的 sha256；CI 41199129663 下载被断）
        uses: actions/cache@v4
        with:
          path: third_party/packs
          key: m0pack-DFP-1.3.1-071bd317fc0f152ded6b2ae594d79c6fc5eb9952370526b4c14ef5b3b9807860
      - name: 打包侧车
        shell: bash
        run: |
          bash tools/fetch_third_party.sh m0pack   # MSPM0 器件包随侧车分发（BSD-3），pyOCD 烧 MSPM0 不用再联网装包
          python -m PyInstaller --onefile --log-level WARN -n dzbench \
            --add-data "third_party/packs/TexasInstruments.MSPM0G1X0X_G3X0X_DFP.1.3.1.pack;packs" \
            --paths app/sidecar --paths host/python --paths third_party/vendored/stm32_mcp_discovery \
            --paths tools --hidden-import dzstep \
            --hidden-import serial.tools.list_ports --collect-submodules pypdf \
            app/sidecar/dzbench_entry.py
          mkdir -p app/src-tauri/binaries
          cp dist/dzbench.exe app/src-tauri/binaries/dzbench-x86_64-pc-windows-msvc.exe
      - name: 冒烟：打包后的侧车能在本进程里跑 tools/*.py
        shell: bash
        working-directory: app/dz-repo
        run: |
          ../../dist/dzbench.exe tools/req.py --help | head -3
          # 侧车自身的模块（含 stepproto → tools/dzstep.py）必须在包里：在本进程里 import 一遍，缺了就 ModuleNotFoundError
          mods="dzbench.session, dzstep"; [ -f ../sidecar/dzbench/stepproto.py ] && mods="$mods, dzbench.stepproto"
          printf 'import %s\nprint("ok frozen imports: %s")\n' "$mods" "$mods" > "$RUNNER_TEMP/smoke_imports.py"
          ../../dist/dzbench.exe "$RUNNER_TEMP/smoke_imports.py"
      - name: 自带嵌入版 Python 3.12.10 + 预装依赖 + wheelhouse/manifest.json（tools/stage_pyembed.sh，与 package_windows.sh 同一份逻辑）
        shell: bash
        env: { PY: python }
        run: bash tools/stage_pyembed.sh app/dz-pyembed
      - name: 冒烟：断网（PIP_NO_INDEX）下自带 python 跑 doctor 必须 ok:true，五个包都能导入
        shell: bash
        env: { PIP_NO_INDEX: "1", PIP_INDEX_URL: "http://0.0.0.0/disabled", PYTHONUTF8: "1", PYTHONPATH: "", PYTHONHOME: "" }
        run: |
          inst="$RUNNER_TEMP/inst"; rm -rf "$inst"; mkdir -p "$inst"
          cp -r app/dz-pyembed/python app/dz-pyembed/wheelhouse "$inst/"; cp -r app/dz-repo "$inst/repo"
          py="$inst/python/python.exe"
          "$py" -c "import sys; print(sys.version); assert sys.version_info[:2] == (3, 12)"
          "$py" -c "import control, scipy, numpy, sysidentpy, uncertainties; print('ok imports', numpy.__version__, scipy.__version__)"
          out=$("$py" "$inst/repo/tools/plantmodel.py" doctor) || { echo "::error::doctor 退出码非 0：$out"; exit 1; }
          echo "$out"
          echo "$out" | "$py" -c "import json,sys; d=json.load(sys.stdin); assert d['ok'] is True and d['reason'] is None, d; assert d['install_cmd'] and 'python.exe' in d['install_cmd'], d"
          "$py" "$inst/repo/tools/pydeps.py" repair   # 补救路径：离线重装也得能过
      - name: 安装包（resources 带上 repo\）
        shell: bash
        working-directory: app/src-tauri
        run: |
          echo '{"bundle":{"resources":{"../dz-repo/":"repo/","../dz-pyembed/python/":"python/","../dz-pyembed/wheelhouse/":"wheelhouse/","../dz-pyembed/安装离线依赖.bat":"install-offline-deps.bat","../packaging/使用说明.txt":"README-zh.txt"}}}' > ci-resources.json
          npx --yes @tauri-apps/cli@2 build --config ci-resources.json
          ls -la target/release/bundle/nsis/
      - name: 安装冒烟：旧版电赛工作台 → 新版 /S 静默安装（只一个芯台快捷方式、旧目录已删、工程保留）
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $nsis = "${env:ProgramFiles(x86)}\NSIS\makensis.exe"
          if (-not (Test-Path $nsis)) { choco install nsis -y --no-progress | Out-Null }
          $old = "$env:RUNNER_TEMP\oldinst"; New-Item -ItemType Directory -Force $old | Out-Null
          Copy-Item app\src-tauri\windows\ci\old-dzbench.nsi $old
          Push-Location $old; & $nsis /INPUTCHARSET UTF8 old-dzbench.nsi; if ($LASTEXITCODE) { throw "makensis 失败" }; Pop-Location
          Start-Process "$old\old-setup.exe" -ArgumentList "/S" -Wait
          $oldDir = Join-Path $env:LOCALAPPDATA "电赛工作台"
          if (-not (Test-Path "$oldDir\uninstall.exe")) { throw "旧版没装上" }
          $proj = Join-Path $HOME ".dzbench\projects\ci-keep"; New-Item -ItemType Directory -Force $proj | Out-Null
          Set-Content "$proj\marker.txt" "keep"
          $setup = Get-ChildItem app\src-tauri\target\release\bundle\nsis\*.exe | Select-Object -First 1
          $p = Start-Process $setup.FullName -ArgumentList "/S" -Wait -PassThru
          if ($p.ExitCode) { throw "新版安装退出码 $($p.ExitCode)" }
          $sm = @("$env:APPDATA\Microsoft\Windows\Start Menu\Programs", "$env:ProgramData\Microsoft\Windows\Start Menu\Programs")
          $lnk = Get-ChildItem $sm -Recurse -Filter *.lnk -ErrorAction SilentlyContinue | Where-Object { $_.BaseName -match "芯台|XinTai|电赛工作台" }
          $lnk | ForEach-Object { Write-Host "快捷方式: $($_.FullName)" }
          $fail = @()
          if (@($lnk).Count -ne 1 -or $lnk[0].BaseName -ne "芯台") { $fail += "(a) 开始菜单应只有一个 芯台.lnk，实际 $(@($lnk).Count) 个" }
          if (Test-Path $oldDir) { $fail += "(b) 旧程序目录还在：$oldDir" }
          if (-not (Test-Path "$proj\marker.txt")) { $fail += "(c) 测试工程丢了：$proj" }
          if ($fail) { $fail | ForEach-Object { Write-Host "::error::$_" }; exit 1 }
          Write-Host "安装冒烟通过：一个芯台快捷方式、旧目录已删、工程保留"
      - name: 安装后检查：安装目录里 roles.json / reason_codes.json 齐全，自带 python 在仓库外读到 6 个角色
        shell: bash
        env: { PIP_NO_INDEX: "1", PYTHONUTF8: "1", PYTHONPATH: "" }
        run: |
          base=$(cygpath -u "$LOCALAPPDATA")
          rj=$(find "$base" -path '*/repo/docs/dev/roles.json' 2>/dev/null | head -1)
          [ -n "$rj" ] || { echo "::error::安装目录里找不到 repo/docs/dev/roles.json（安装包没带上角色表）"; exit 1; }
          inst=$(dirname "$(dirname "$(dirname "$(dirname "$rj")")")")
          echo "安装目录：$inst"
          py="$inst/python/python.exe"
          [ -f "$py" ] || { echo "::error::安装目录里没有自带 python：$py"; exit 1; }
          fail=0
          [ -f "$inst/repo/docs/dev/reason_codes.json" ] || { echo "::error::安装目录缺 repo/docs/dev/reason_codes.json（原因码表；后端 #123 合入后才有，缺了就是红）"; fail=1; }
          cd "$RUNNER_TEMP"   # 仓库外跑：只能读到安装目录里的文件
          "$py" - "$(cygpath -w "$inst")" <<'PY' || fail=1
          import json, pathlib, sys
          inst = pathlib.Path(sys.argv[1]).resolve()
          f = inst / "repo" / "docs" / "dev" / "roles.json"
          try:
              d = json.loads(f.read_text(encoding="utf-8"))
          except Exception as e:
              sys.exit(f"角色表 {f} 读不出来：{e}")
          if d.get("schema_version") != 1:
              sys.exit(f"角色表 schema_version 应为 1，实际 {d.get('schema_version')!r}")
          roles = d.get("roles") or []
          codes = [r.get("code") for r in roles]
          if codes != ["P", "I", "D", "FF", "LIM", "other"] or not all(r.get("zh") for r in roles):
              sys.exit(f"角色表应是 6 个带中文名的角色 P/I/D/FF/LIM/other，实际 {roles}")
          if "tools" in f.parts[len(inst.parts):-1] or not str(f).startswith(str(inst)):
              sys.exit(f"读到的不是安装目录里的角色表：{f}")
          rc = inst / "repo" / "docs" / "dev" / "reason_codes.json"
          if rc.is_file():
              try:
                  json.loads(rc.read_text(encoding="utf-8"))
              except Exception as e:
                  sys.exit(f"原因码表 {rc} 读不出来：{e}")
          print("✓ 安装目录角色表：", "、".join(f"{r['code']}={r['zh']}" for r in roles), "（", f, "）")
          PY
          # 侧车自检 selfcheck-data（后端在加）：有就必须退出码 0；还没有就只做上面的读取检查
          if grep -rqs "selfcheck-data" "$inst/repo/app/sidecar/dzbench"; then
            cd "$inst"
            # 嵌入版 ._pth 模式不认 PYTHONPATH/当前目录，显式把安装目录里的侧车源码加进 sys.path
            "$py" -c "import sys,runpy; sys.path.insert(0, sys.argv[1]); sys.argv=['dzbench','selfcheck-data']; runpy.run_module('dzbench', run_name='__main__')" \
              "$(cygpath -w "$inst/repo/app/sidecar")" || { echo "::error::自带 python 跑 dzbench selfcheck-data 失败（安装目录数据不全）"; fail=1; }
          else
            echo "提示：这一版侧车还没有 selfcheck-data 命令，只做了 roles.json / reason_codes.json 读取检查"
          fi
          exit $fail
      - uses: actions/upload-artifact@v4
        with:
          name: dzbench-windows
          path: app/src-tauri/target/release/bundle/nsis/*.exe
      - name: 草稿预发布 win-latest（不建 tag）
        if: github.ref == 'refs/heads/main'
        shell: bash
        env: { GH_TOKEN: "${{ github.token }}" }
        run: |
          f=$(ls app/src-tauri/target/release/bundle/nsis/*.exe | head -1)
          notes="main ${GITHUB_SHA::7} 自动构建（草稿，未发布、无 tag）。安装后在顶部端口里选「仿真板 · …」即可无硬件试用。"
          if gh release view win-latest >/dev/null 2>&1; then
            gh release edit win-latest --draft --prerelease --notes "$notes"
            gh release upload win-latest "$f" --clobber
          else
            gh release create win-latest "$f" --draft --prerelease --target "$GITHUB_SHA" --title "芯台 Windows 测试版" --notes "$notes"
          fi
