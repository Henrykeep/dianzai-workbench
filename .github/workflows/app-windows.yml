# 电赛工作台 Windows 安装包（未验证：作者环境无 Windows runner，首次运行请看日志）
# 产物：NSIS 安装包（含 PyInstaller 打包的侧车 dzbench-x86_64-pc-windows-msvc.exe）
name: app-windows
on:
  workflow_dispatch:
  push:
    branches: [main]          # 每次推 main 都跑 Windows：只有 main 的 Windows 绿了才打 tag（v0.8.0 教训）
    tags: ["app-v*", "v*"]
jobs:
  sidecar-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with: { python-version: "3.12" }
      - run: pip install -r app/sidecar/requirements.txt
      - run: make BOARD=host-sim APP=car_2wd && make BOARD=host-sim APP=2026H_ball
      - run: python -m pytest -q app/sidecar/tests   # e2e 需要 host-sim（make + cc，ubuntu 自带）
  build:
    needs: sidecar-test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with: { python-version: "3.12" }
      - uses: actions/setup-node@v5
        with: { node-version: "22", cache: npm, cache-dependency-path: app/ui/package-lock.json }
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with: { workspaces: app/src-tauri }
      - name: 单元测试（Windows 上自动跳过仿真 e2e）
        run: |
          pip install -r app/sidecar/requirements.txt pyinstaller
          python -m pytest -q app/sidecar/tests
      - name: 打包侧车
        shell: bash
        run: |
          bash tools/fetch_third_party.sh m0pack   # MSPM0 器件包随侧车分发（BSD-3），pyOCD 烧 MSPM0 不用再联网装包
          python -m PyInstaller --onefile --log-level WARN -n dzbench \
            --add-data "third_party/packs/TexasInstruments.MSPM0G1X0X_G3X0X_DFP.1.3.1.pack;packs" \
            --paths app/sidecar --paths host/python --hidden-import serial.tools.list_ports \
            app/sidecar/dzbench_entry.py
          mkdir -p app/src-tauri/binaries
          cp dist/dzbench.exe app/src-tauri/binaries/dzbench-x86_64-pc-windows-msvc.exe
      - run: npm ci
        working-directory: app/ui
      - run: npx --yes @tauri-apps/cli@2 build
        working-directory: app/src-tauri
      - uses: actions/upload-artifact@v4
        with:
          name: dzbench-windows
          path: app/src-tauri/target/release/bundle/nsis/*.exe
