# MSPM0：用真实 TI SysConfig CLI 从 .syscfg 重新生成 ti_msp_dl_config，与入库版本比对，再交叉编译 car_2wd。
# 版本锁：SysConfig 1.28.0.4712（TI 官方 Linux 安装包）+ MSPM0 SDK 2.11.00.07（GitHub TexasInstruments/mspm0-sdk）。
name: mspm0-syscfg
on:
  workflow_dispatch:
  push:
    paths: ["boards/mspm0*/**", "ports/mspm0-driverlib/**", "tools/syscfg_gen.sh", "tools/gen_board.py", ".github/workflows/mspm0-syscfg.yml"]
jobs:
  syscfg:
    runs-on: ubuntu-latest
    env:
      SYSCFG_VER: 1.28.0.4712
      SYSCFG_CLI: /home/runner/ti/sysconfig_1.28.0/sysconfig_cli.sh
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with: { python-version: "3.12" }
      - run: pip install pyyaml jsonschema
      - name: 缓存 SysConfig
        id: sc
        uses: actions/cache@v4
        with: { path: /home/runner/ti/sysconfig_1.28.0, key: sysconfig-1.28.0.4712 }
      - name: 安装 SysConfig CLI
        if: steps.sc.outputs.cache-hit != 'true'
        run: |
          f=sysconfig-1.28.0_4712-setup.run
          curl -fsSL -o $f "https://dr-download.ti.com/software-development/ide-configuration-compiler-or-debugger/MD-nsUM6f7Vvb/$SYSCFG_VER/$f"
          chmod +x $f && ./$f --mode unattended --prefix /home/runner/ti/sysconfig_1.28.0
      - run: tools/fetch_third_party.sh mspm0
      - name: .syscfg -> ti_msp_dl_config 一致性
        run: tools/syscfg_gen.sh
      - run: sudo apt-get update && sudo apt-get install -y gcc-arm-none-eabi
      - run: make BOARD=mspm0g3507-tianmengxing APP=car_2wd
