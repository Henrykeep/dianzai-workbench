# MSPM0：用真实 TI SysConfig CLI 从 .syscfg 重新生成 ti_msp_dl_config，与入库版本比对，再交叉编译 car_2wd。
# 版本锁：SysConfig 1.28.0.4712（TI 官方 Linux 安装包）+ MSPM0 SDK 2.11.00.07（GitHub TexasInstruments/mspm0-sdk）。
name: firmware
on:
  workflow_dispatch:
  push:
    branches: [main, "release/**"]   # main / 补丁分支每次推都跑，不按路径过滤（打 tag 前要看到这个提交的 firmware 绿）
    tags: ["v*"]
jobs:
  syscfg:
    runs-on: ubuntu-latest
    env:
      SYSCFG_VER: 1.28.0.4712
      SYSCFG_CLI: /home/runner/ti/sysconfig_1.28.0/sysconfig_cli.sh
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with: { python-version: "3.12" }
      - run: pip install pyyaml jsonschema
      - name: 缓存 SysConfig
        id: sc
        uses: actions/cache@v4
        with: { path: /home/runner/ti/sysconfig_1.28.0, key: sysconfig-1.28.0.4712 }
      - name: 安装 SysConfig CLI
        if: steps.sc.outputs.cache-hit != 'true'
        run: |
          f=sysconfig-1.28.0_4712-setup.run
          curl -fsSL -o $f "https://dr-download.ti.com/software-development/ide-configuration-compiler-or-debugger/MD-nsUM6f7Vvb/$SYSCFG_VER/$f"
          chmod +x $f && ./$f --mode unattended --prefix /home/runner/ti/sysconfig_1.28.0
      - run: tools/fetch_third_party.sh mspm0
      - name: .syscfg -> ti_msp_dl_config 一致性
        run: tools/syscfg_gen.sh mspm0g3507-tianmengxing && tools/syscfg_gen.sh mspm0g3507-launchpad
      - name: 缓存 Arm GNU Toolchain 13.3.rel1
        uses: actions/cache@v4
        with: { path: /opt/arm/arm-gnu-toolchain-13.3.rel1-x86_64-arm-none-eabi, key: arm-gnu-toolchain-13.3.rel1-x86_64 }
      - name: Arm GNU Toolchain 13.3.rel1（官方 tarball + sha256，锁版本，见 tools/arm_toolchain.sh）
        run: |
          sudo mkdir -p /opt/arm && sudo chown "$USER" /opt/arm
          tools/arm_toolchain.sh --install
          echo /opt/arm/arm-gnu-toolchain-13.3.rel1-x86_64-arm-none-eabi/bin >> "$GITHUB_PATH"
          tools/arm_toolchain.sh --check
      - run: make BOARD=mspm0g3507-tianmengxing APP=car_2wd && make BOARD=mspm0g3507-launchpad APP=car_2wd
  cross:
    # 全部 板×应用 交叉编译（make cross）。2026-10 发现 2026H 在 F407 上因未用变量 -Werror 编不过而 make check 没报，故加此项。
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with: { python-version: "3.12" }
      - run: pip install pyyaml jsonschema
      - name: 缓存 Arm GNU Toolchain 13.3.rel1
        uses: actions/cache@v4
        with: { path: /opt/arm/arm-gnu-toolchain-13.3.rel1-x86_64-arm-none-eabi, key: arm-gnu-toolchain-13.3.rel1-x86_64 }
      - name: Arm GNU Toolchain 13.3.rel1（官方 tarball + sha256，锁版本，见 tools/arm_toolchain.sh）
        run: |
          sudo mkdir -p /opt/arm && sudo chown "$USER" /opt/arm
          tools/arm_toolchain.sh --install
          echo /opt/arm/arm-gnu-toolchain-13.3.rel1-x86_64-arm-none-eabi/bin >> "$GITHUB_PATH"
          tools/arm_toolchain.sh --check
      - run: tools/fetch_third_party.sh
      - run: make cross
