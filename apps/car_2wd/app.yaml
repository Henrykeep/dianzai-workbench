# 验收用例“只改引脚”：同一份代码在 F103C8T6 / F407(天空星) / MSPM0G3507 / 电脑仿真上编译，
# 换板 = 换 BOARD=xxx，只有各板 board.yaml 不同。LED 是可选资源（有就闪，没有不影响）。
name: car_2wd
version: 1.0.0
description: 两轮差速小车底盘：TB6612 双电机 + 双编码器速度闭环 + dzframe 串口遥测/指令
requires:
  gpio: [MOTOR_A_IN1, MOTOR_A_IN2, MOTOR_B_IN1, MOTOR_B_IN2]
  pwm: [MOTOR_A, MOTOR_B]
  encoder: [MOTOR_A, MOTOR_B]
  uart: [LINK]
  timer: [CTRL]
# 上位机链路（tools/gen_link.py → link_gen.{h,c} + link_schema.json；桌面工作台 app/ 用）
link:
  telemetry:
    id: 2
    period_ms: 20
    fields:
      - { name: t_ms,     type: uint32, unit: ms }
      - { name: sp_a,     type: float, unit: rps, ref_for: spd_a }
      - { name: spd_a,    type: float, unit: rps, cal: { unit: cm/s, pts: [[0, 0], [1, 20.42]] } }   # 轮径 0.065 m（app_main.c s_params）→ π·6.5 cm/圈；sp_a 自动继承
      - { name: sp_b,     type: float, unit: rps, ref_for: spd_b }
      - { name: spd_b,    type: float, unit: rps, cal: { unit: cm/s, pts: [[0, 0], [1, 20.42]] } }
      - { name: ctrl_err, type: uint32 }
  # 验收规格（上位机判“到位”，不进 schema 哈希）。单位 = 标定后的 cm/s。示例阈值，不是任何题目的要求——按题目改
  accept:
    - { name: 轮速阶跃（示例）, y: spd_a, band: 2, hold_s: 0.3, t_max_s: 1.0, runs: 3 }
  # 保护阈值表里只读显示的编译期常量（改要重烧）。界面不认名字，按这里列
  protect_fixed:
    - { name: 看门狗, value: 500, unit: ms, where: apps/car_2wd/app_main.c WDG_MS }
  params:
    - { name: kp,             type: float,  default: 0.08, min: 0,   max: 2,    desc: 轮速 PID（起步值，未实测） }
    - { name: ki,             type: float,  default: 1.5,  min: 0,   max: 20,   desc: 轮速 PID（起步值，未实测） }
    - { name: max_rps,        type: float,  default: 5.0,  min: 0,   max: 20,   unit: rps, protect: 限幅 }
    - { name: accel_rps2,     type: float,  default: 10.0, min: 0.1, max: 100,  unit: rps/s, protect: 限幅 }
    - { name: cmd_timeout_ms, type: uint32, default: 200,  min: 50,  max: 2000, unit: ms, desc: 断线停车, protect: 断线停车 }
