# 仿真被控对象：直流电机位置环（也能直接上真板：只用逻辑资源）。
# 位置 PID 输出占空比；设定值走 DATA id=1（f32 度，见 apps/include/link_app.h）。
name: motor_pos
version: 1.0.0
description: 直流电机 + 编码器位置闭环（单环 PID，带死区补偿和输出限幅）
requires:
  gpio: [MOTOR_A_IN1, MOTOR_A_IN2]
  pwm: [MOTOR_A]
  encoder: [MOTOR_A]
  uart: [LINK]
  timer: [CTRL]
link:
  telemetry:
    id: 2
    period_ms: 10
    fields:
      - { name: t_ms,    type: uint32, unit: ms }
      - { name: sp_deg,  type: float, unit: deg, ref_for: pos_deg }
      - { name: pos_deg, type: float, unit: deg }
      - { name: u,       type: float }
      - { name: run,     type: uint8, enum: [STOPPED, RUNNING, ESTOP], pin: 状态 }
  # #38 阶跃实验（DATA 0x7B）：板上按遥测节拍算指标，发 step_result（dzctl 0.13.0，firmware/proto/dzctl/README.md）
  step:
    - { sp: 0, y: pos_deg, u: u, u_max: max_u, range: 720, abs_tol: 0.5 }
  params:
    - { name: kp,       type: float, default: 0.02, min: 0,    max: 0.5, desc: 位置 PID（仿真起步值） }
    - { name: ki,       type: float, default: 0.0,  min: 0,    max: 1 }
    - { name: kd,       type: float, default: 0.0008, min: 0,  max: 0.02 }
    - { name: deadband, type: float, default: 0.03, min: 0,    max: 0.3, max_delta: 0.1, desc: 死区补偿（占空比） }
    - { name: max_u,    type: float, default: 0.8,  min: 0.1,  max: 1 }
