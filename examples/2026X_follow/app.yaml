# 第二道参考例题（D 题式双车）：前车循线 + 后车循线跟车，两车走 peerlink（LoRa / 蓝牙透传串口）。
# 同一份固件，参数 role 选前车/后车；host-sim 里前车由 sim_setup.c 虚拟（脚本化里程 + 真实帧格式），后车跑真代码。
name: 2026X_follow
version: 0.1.0
description: 双车循线跟车：line_obs 丢线找线 + peerlink 状态/中止帧 + follow 间距控制；急停/中止/链路断/前车急刹都停车
requires:
  gpio: [MOTOR_A_IN1, MOTOR_A_IN2, MOTOR_B_IN1, MOTOR_B_IN2, LINE0, LINE1, LINE2, LINE3, LINE4, LINE5, LINE6, LINE7]
  pwm: [MOTOR_A, MOTOR_B]
  encoder: [MOTOR_A, MOTOR_B]
  uart: [LINK, PEER]
  timer: [CTRL]
link:
  telemetry:
    id: 2
    period_ms: 20
    fields:
      - { name: t_ms,     type: uint32, unit: ms }
      - { name: mode,     type: uint8, enum: [STOP, RUNNING, ESTOP, SEARCH, ABORT], pin: 跟车, pin_with: [fstate, peer_age_ms] }
      - { name: fstate,   type: uint8, enum: [OK, TOO_CLOSE, LINK_LOST] }
      - { name: gap_sp_m, type: float, unit: m, ref_for: gap_m }
      - { name: gap_m,    type: float, unit: m }
      - { name: v_cmd,    type: float, unit: m/s }
      - { name: v_self,   type: float, unit: m/s }
      - { name: v_lead,   type: float, unit: m/s }
      - { name: s_self,   type: float, unit: m }
      - { name: line_mm,  type: float, unit: mm }
      - { name: peer_age_ms, type: uint32, unit: ms }
      - { name: peer_drop, type: uint32 }
  accept:
    - { name: 跟车间距（示例）, y: gap_m, band: 0.05, hold_s: 2, runs: 3 }
  params:
    - { name: role,     type: uint8, default: 1, min: 0, max: 1, desc: "0 前车（只循线、广播状态）/ 1 后车（跟车）" }
    - { name: v_base,   type: float, default: 0.30, min: 0, max: 1.2, unit: m/s, desc: 前车巡航速度（后车的速度上限 = 1.3×它） }
    - { name: kp_line,  type: float, default: 0.05, min: 0, max: 0.5, unit: rps/mm, desc: 线位置比例（同 line_car） }
    - { name: kd_line,  type: float, default: 0.0, min: 0, max: 0.05 }
    - { name: kp,       type: float, default: 0.08, min: 0, max: 2, desc: 轮速 PI }
    - { name: ki,       type: float, default: 1.5, min: 0, max: 20 }
    - { name: v_search, type: float, default: 0.15, min: 0, max: 0.6, unit: m/s, desc: 丢线原地找线轮速 }
    - { name: gap_ref_m, type: float, default: 0.40, min: 0.1, max: 3, unit: m, desc: 目标间距 }
    - { name: gap_min_m, type: float, default: 0.20, min: 0.05, max: 3, unit: m, desc: 小于它立刻停（安全底线） }
    - { name: gap0_m,   type: float, default: 0.40, min: 0, max: 5, unit: m, desc: 发车时两车间距（实测填；两车同时清零里程） }
    - { name: f_kp,     type: float, default: 1.2, min: 0, max: 10, unit: 1/s, desc: 间距比例 }
    - { name: f_kd,     type: float, default: 0.5, min: 0, max: 5, desc: 速度差阻尼 }
    - { name: f_decel,  type: float, default: 1.5, min: 0.1, max: 10, unit: m/s², desc: 链路断/前车停时的减速度 }
    - { name: peer_ms,  type: uint32, default: 20, min: 10, max: 500, unit: ms, desc: "STATE 帧周期（LoRa 空速低就加大，stale_ms 至少给它 5 倍）" }
    - { name: stale_ms, type: uint32, default: 200, min: 40, max: 2000, unit: ms, desc: 超过它没收到前车帧 = 链路断 }
    - { name: wheel_circ_m, type: float, default: 0.2042, min: 0.05, max: 1, unit: m, desc: 轮周长（65 mm 轮，实测 10 圈标定） }
