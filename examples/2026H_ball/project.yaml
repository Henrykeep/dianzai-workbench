# 2026 H 题参考实例：单轴球杆（钢珠在摆杆上，QD4310 无刷电机控制摆杆角度）+ 两轮底盘 + MaixCAM2 视觉。
# 结构与参数来自用户 P1（Bldc，F407）/P2（Car_Mode1021，F103）两份工程的阅读整理（docs/12）。
# ⚠ 所有数值参数：**来自非最终版比赛代码，未验证**（P1 为主，α-β/超前/摆杆零点限位来自 P2），上车前逐项实测。
# 具体测试项请以官方题目原文为准；tests 只是占位示例。
schema_version: 1
name: 2026H_ball
description: 两轮底盘 + 单轴球杆（QD4310 摆杆）+ 视觉（MaixCAM2，dzframe 二进制帧）

boards:
  main: stm32f407-bldc-freertos-cubemx   # P1 的 F407 小车（UART4=BEAM、USART2=VISION）；换板只改 BOARD=
  vision_cpu: maixcam2-vision            # 协处理板：经 VISION 串口发 dzframe 帧；自动生成 cp_vision_cpu.{h,c}

state:
  io_in:
    owner: io
    fields:
      - { name: wheel_a_mps, type: float, unit: m/s, desc: 左轮线速度（编码器，左右对应关系未验证） }
      - { name: wheel_b_mps, type: float, unit: m/s, desc: 右轮线速度 }
      - { name: cam_x_px,    type: int16, unit: px, desc: 钢珠相对画面中心 x }
      - { name: cam_flags,   type: uint8, desc: 视觉帧 flags（bit0 有效 bit1 预测 bit2 标定过期 bit3 识别到） }
      - { name: cam_seq,     type: uint32, desc: 收到的有效帧计数 }
      - { name: cam_rx_ms,   type: uint32, unit: ms, desc: 最近一帧到达本机时刻 }
      - { name: cam_fseq,    type: uint8, desc: 最近一帧的 dzframe seq（8 位回绕，用于丢帧统计） }
      - { name: cam_ms,      type: uint32, unit: ms, desc: 最近一帧的相机时间戳（相机本地时钟） }
      - { name: imu_ax_mps2, type: float, unit: m/s², desc: "IMU 前向加速度（io 层按板上资源取：uart IMU 姿态模块 / i2c MPU6050；未上板验证）" }
      - { name: imu_rx_ms,   type: uint32, unit: ms, desc: IMU 最近一次有效读数时刻 }
      - { name: imu_ok,      type: bool, desc: IMU 读数有效 }
      - { name: beam_online, type: bool, desc: QD4310 链路在线（最近 100 ms 内有回包） }
      - { name: beam_fb_deg, type: float, unit: °, desc: QD4310 回报的绝对角 }
  coord:
    owner: coord
    fields:
      - { name: test_id,     type: uint8 }
      - { name: chassis_mps, type: float, unit: m/s }
      - { name: ball_sp_px,  type: float, unit: px, desc: 钢珠目标位置（相对画面中心） }
  vision_out:
    owner: vision
    fields:
      - { name: new_sample, type: bool, desc: 本周期有新的有效样本 }
      - { name: x_px,       type: float, unit: px }
      - { name: t_ms,       type: uint32, unit: ms, desc: 样本到达时刻 }
      - { name: state,      type: uint8, desc: "vis_state_t：0 lost / 1 held / 2 valid" }
      - { name: age_ms,     type: uint32, unit: ms, desc: 最近有效帧的数据时效（从未收到 = UINT32_MAX） }
      - { name: drops,      type: uint32, desc: 按 seq 统计的丢帧数 }
      - { name: lat_jit_ms, type: int32, unit: ms, desc: 相对延迟抖动（比最快帧慢多少） }
      - { name: x_raw_px,   type: float, unit: px, desc: 标定前像素（x_px 是标定后的） }
  chassis_out:
    owner: chassis
    fields:
      - { name: cmd_a, type: float, desc: -1..1 }
      - { name: cmd_b, type: float, desc: -1..1 }
      - { name: accel_mps2, type: float, desc: 底盘加速度估计（滤波后），给钢珠环前馈 }
  beam_out:
    owner: ball
    fields:
      - { name: angle_deg,  type: float, unit: °, desc: 相对水平的摆杆角 }
      - { name: target_abs_deg, type: float, unit: °, desc: 下发给 QD4310 的绝对角（零点+角度，已硬限位） }
      - { name: state, type: uint8, desc: ball_beam_state_t }
      - { name: ff_deg, type: float, unit: °, desc: 实际使用的加速度前馈（含死区/失效保护后） }

subsystems:
  - { name: vision,  board: main, period_ms: 5,  owns: [vision_out],  reads: [io_in] }
  - { name: chassis, board: main, period_ms: 10, owns: [chassis_out], reads: [io_in, coord] }
  - { name: ball,    board: main, period_ms: 10, owns: [beam_out],    reads: [vision_out, coord, chassis_out, io_in] }   # io_in：IMU 前馈（ff_src=1），原来漏声明

params:
  # 底盘（P1：1456 counts/rev，周长 0.2041 m；是否 4 倍频未知——用 docs/12 的 10 圈标定确认）
  - { name: counts_per_rev, type: float, default: 1456, min: 100, max: 20000, unit: "count/rev", desc: 来自非最终版比赛代码，未验证 }
  - { name: wheel_circ_m,   type: float, default: 0.2041, min: 0.05, max: 1, unit: "m", desc: 来自非最终版比赛代码，未验证 }
  - { name: chassis_kp,     type: float, default: 0.8, min: 0, max: 50, unit: "", desc: "占位：P1 轮速 PID 输出是 CCR，量纲不同不能直接搬（TODO 实调）" }
  - { name: chassis_ki,     type: float, default: 4.0, min: 0, max: 200, unit: "", desc: 占位（TODO 实调） }
  # 钢珠环（P1 普通档；α-β 与超前来自 P2）
  - { name: bb_alpha,   type: float, default: 0.55, min: 0, max: 1, unit: "", desc: P2，未验证 }
  - { name: bb_beta,    type: float, default: 0.20, min: 0, max: 1, unit: "", desc: P2，未验证 }
  - { name: bb_lead_s,  type: float, default: 0.07, min: 0, max: 0.3, unit: "s", desc: P2 超前 70 ms，未验证 }
  - { name: pos_k,      type: float, default: 0.72, min: 0, max: 5, unit: "(px/s)/px", desc: "(px/s)/px，P1，未验证" }
  - { name: vel_max,    type: float, default: 320,  min: 0, max: 2000, unit: "px/s", desc: px/s，P1，未验证 }
  - { name: vel_k,      type: float, default: 0.016, min: 0, max: 0.2, unit: "°/(px/s)", desc: "°/(px/s)，P1，未验证" }
  - { name: ball_ki,    type: float, default: 0.055, min: 0, max: 1, unit: "°/(px·s)", desc: P1，单位按 °/(px·s) 解读（P1 代码单位未写明，未验证） }
  - { name: i_zone_px,  type: float, default: 55, min: 0, max: 400, unit: "px", desc: P1，未验证 }
  - { name: i_max_deg,  type: float, default: 2.5, min: 0, max: 15, unit: "°", desc: P1，未验证 }
  - { name: i_decay,    type: float, default: 0.5, min: 0, max: 1, unit: "", desc: 误差变号时积分衰减系数（P1 衰减比例未整理，TODO 核对） }
  # 目标斜坡（firmware/algo/slew，通用设定值限速；思路参考 nuedc-2026-h-ball-balance 的 moving reference）：0 = 关，目标阶跃直接给
  - { name: sp_rate_pxps, type: float, default: 200, min: 0, max: 2000, unit: "px/s", desc: 目标点移动速率上限（0 关） }
  - { name: sp_slow_pxps, type: float, default: 60, min: 0, max: 2000, unit: "px/s", desc: 离最终目标 sp_slow_band_px 以内改用的慢速（0 = 不分段） }
  - { name: sp_slow_band_px, type: float, default: 40, min: 0, max: 400, unit: "px", desc: 分段斜坡的慢速区宽度 }
  - { name: i_vel_pxps, type: float, default: 10, min: 0, max: 400, unit: "px/s", desc: "条件积分：球速低于它才积分（0 关）" }
  - { name: i_leak, type: float, default: 0.97, min: 0, max: 0.999, unit: "", desc: "不满足积分条件时每帧积分乘它（0 关；参考 31/32 ≈ 0.97）" }
  - { name: angle_max_deg, type: float, default: 5.5, min: 0, max: 20, unit: "°", desc: P1，未验证 }
  - { name: rate_max_dps,  type: float, default: 220, min: 0, max: 1000, unit: "°/s", desc: P1，未验证 }
  - { name: hold_ms,    type: uint32, default: 120, min: 0, max: 2000, unit: "ms", desc: P1 预测保持，未验证 }
  - { name: vision_timeout_ms, type: uint32, default: 600, min: 50, max: 5000, unit: "ms", desc: P1，未验证 }
  - { name: beam_dir,   type: float, default: 1.0, min: -1, max: 1, unit: "", desc: "TODO(用户)：+1/-1，θ>0 应使球向 +x 滚（P2 的 BEAM_DIR 也标着待确认）" }
  # 视觉链路与标定（firmware/algo/vision）。标定把原始像素映射为“线性化像素”，所以钢珠环增益不用改
  - { name: vis_hold_ms, type: uint32, default: 60, min: 1, max: 1000, unit: "ms", desc: 超过它判 HELD（约 2 帧），未验证 }
  - { name: vis_lost_ms, type: uint32, default: 300, min: 2, max: 5000, unit: "ms", desc: 超过它判 LOST，未验证 }
  - { name: cal_n,   type: uint8, default: 0, min: 0, max: 5, unit: "", desc: "标定点数（0 关；≥4 推荐：中心两侧各 2 点，左右斜率独立）" }
  - { name: cal_px0, type: float, default: -150, min: -2000, max: 2000, unit: "px", desc: 原始像素，严格递增 }
  - { name: cal_px1, type: float, default: -60,  min: -2000, max: 2000, unit: "px", desc: "" }
  - { name: cal_px2, type: float, default: 0,    min: -2000, max: 2000, unit: "px", desc: "" }
  - { name: cal_px3, type: float, default: 60,   min: -2000, max: 2000, unit: "px", desc: "" }
  - { name: cal_px4, type: float, default: 150,  min: -2000, max: 2000, unit: "px", desc: "" }
  - { name: cal_v0,  type: float, default: -150, min: -2000, max: 2000, unit: "px", desc: "线性化像素 = 实测距离 / 中心处 mm/px" }
  - { name: cal_v1,  type: float, default: -60,  min: -2000, max: 2000, unit: "px", desc: "" }
  - { name: cal_v2,  type: float, default: 0,    min: -2000, max: 2000, unit: "px", desc: "" }
  - { name: cal_v3,  type: float, default: 60,   min: -2000, max: 2000, unit: "px", desc: "" }
  - { name: cal_v4,  type: float, default: 150,  min: -2000, max: 2000, unit: "px", desc: "" }
  # 钢珠环 A/B 选项（0 = A 默认；B 是回退方案，A 调不动时切换对比）
  - { name: bb_est_mode,  type: uint8, default: 0, min: 0, max: 1, unit: "", desc: "0 α-β / 1 差分+低通" }
  - { name: bb_loop_mode, type: uint8, default: 0, min: 0, max: 1, unit: "", desc: "0 串级（限 v_des）/ 1 单环" }
  - { name: stic_deg,  type: float, default: 1, min: 0, max: 3, unit: "°", desc: 静摩擦补偿（0 关），未验证 }
  - { name: stic_vel,  type: float, default: 8, min: 0, max: 200, unit: "px/s", desc: 球速低于它才补偿 }
  - { name: stic_e,    type: float, default: 15, min: 0, max: 400, unit: "px", desc: 误差大于它才补偿 }
  - { name: bal_span_px, type: float, default: 0, min: 0, max: 1000, unit: "px", desc: "静平衡前馈表 x = −span/0/+span（0 关）" }
  - { name: bal_l_deg, type: float, default: 0, min: -10, max: 10, unit: "°", desc: 球静止在 −span 处所需摆杆角（实测填） }
  - { name: bal_c_deg, type: float, default: 0, min: -10, max: 10, unit: "°", desc: 中心处 }
  - { name: bal_r_deg, type: float, default: 0, min: -10, max: 10, unit: "°", desc: +span 处 }
  # 加速度前馈来源与保护
  - { name: ff_src,      type: uint8, default: 0, min: 0, max: 1, unit: "", desc: "0 编码器差分 / 1 IMU（IMU 失效自动回退为 0 前馈）" }
  - { name: ff_dead_mps2, type: float, default: 0.15, min: 0, max: 5, unit: "m/s²", desc: 死区：小于它不前馈（滤掉噪声抖动） }
  - { name: ff_fail_mps2, type: float, default: 8, min: 0.5, max: 50, unit: "m/s²", desc: 超过它视为读数异常 → 前馈置 0 }
  - { name: imu_grav_comp, type: uint8, default: 1, min: 0, max: 1, unit: "", desc: "1=用姿态模块的 roll/pitch 去掉前向加速度里的重力分量（仅 uart 姿态模块路径；未上板验证）" }
  - { name: imu_axis, type: uint8, default: 0, min: 0, max: 5, unit: "", desc: "IMU 哪根轴朝车头：0 +x 1 −x 2 +y 3 −y 4 +z 5 −z（按实际安装改）" }
  - { name: imu_timeout_ms, type: uint32, default: 50, min: 1, max: 1000, unit: "ms", desc: IMU 数据超过它没更新 → 前馈置 0 }
  # 摆杆机械（P2 那台机械的值，换机械必须重测）
  - { name: beam_zero_deg, type: float, default: 82.02, min: 0, max: 360, unit: "°", desc: P2 电机绝对角零点，只对那台机械有效，未验证 }
  - { name: beam_min_deg,  type: float, default: 61, min: 0, max: 360, unit: "°", desc: P2 硬限位，未验证 }
  - { name: beam_max_deg,  type: float, default: 105, min: 0, max: 360, unit: "°", desc: P2 硬限位，未验证 }
  # 底盘加速度前馈（P1：θ ≈ a/g·57.3·1.30，上限 5°）
  - { name: ff_gain,    type: float, default: 0.0, min: 0, max: 3, unit: "", desc: 0 关闭；P1 为 1.30（快档开启），未验证 }
  - { name: ff_max_deg, type: float, default: 5.0, min: 0, max: 15, unit: "°", desc: P1，未验证 }

# 上位机链路（tools/gen_link.py）：遥测 DATA id=2 每 20 ms；参数直接用上面的 params（当前参数档）
link:
  telemetry:
    id: 2
    period_ms: 20
    fields:
      - { name: t_ms,       type: uint32, unit: ms }
      - { name: state,      type: uint8, enum: [IDLE, RUNNING, DONE, ESTOP, FAULT] }
      - { name: test_id,    type: uint8 }
      - { name: cam_x_px,   type: int16, unit: px, cal: { unit: cm, pts: [[0, 0], [600, 100]] } }   # 仿真 1 m = 600 px（io/sim_setup.c SIM_PX_PER_M）；真机用 O/±5 cm 多点实测重标
      - { name: ball_sp_px, type: float, unit: px, ref_for: cam_x_px }
      - { name: angle_deg,  type: float, unit: "°" }
      - { name: beam_fb_deg, type: float, unit: "°" }
      - { name: wheel_a_mps, type: float, unit: m/s }
      - { name: wheel_b_mps, type: float, unit: m/s }
      - { name: bb_state,   type: uint8 }
      - { name: beam_online, type: uint8 }
      - { name: vis_state,  type: uint8, enum: [LOST, HELD, VALID], pin: 视觉, pin_with: [vis_age_ms, vis_drops] }
      - { name: vis_age_ms, type: uint32, unit: ms }
      - { name: vis_drops,  type: uint32 }
      - { name: vis_lat_ms, type: int16, unit: ms }
      - { name: ff_deg,     type: float, unit: "°" }
      - { name: imu_ax_mps2, type: float, unit: m/s² }
      - { name: imu_ok,     type: uint8 }
      - { name: cpu_pm,     type: uint16, na: 65535, unit: "‰" }      # CPU 负载千分比；0xFFFF = 无数据（裸机 / 没开运行时统计）
      - { name: stk_min_w,  type: uint16, na: 65535, unit: 字 }      # 所有任务里最小的栈余量（4 字节/字）；0xFFFF = 无数据

  # 验收（评委口径，来源见 docs/参考来源.md）：误差 ≤1 cm、保持 300 ms、O→+5→−5 一次计时 ≤5 s、连续 3 次按最差。
  # 速度门限题目只说“静止”，没给数，留空（填了才判）；只有位置环有设定值上报，不声明 loops（内环没有 sp/y 遥测）
  accept:
    - { name: 静态定位, y: cam_x_px, band: 1, hold_s: 0.3, t_max_s: 5, runs: 3 }

profiles:
  - { name: base, desc: P1 普通档 }
  - { name: fast, desc: P1 快档 + 前馈, set: { pos_k: 0.86, vel_max: 420, vel_k: 0.018, angle_max_deg: 6.5, rate_max_dps: 320, ff_gain: 1.30 } }

tests:      # TODO(用户)：按官方题目原文改写小题、限时
  - { id: 1, name: 示例-静止平衡钢珠, profile: base, time_limit_s: 30 }
  - { id: 2, name: 示例-行驶中保持钢珠, profile: fast, time_limit_s: 60 }
